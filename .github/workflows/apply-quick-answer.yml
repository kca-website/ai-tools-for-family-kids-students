name: Apply quick-answer blocks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-quick-answer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch informational landing pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          summaries = {
            'ai-ergaleia-gia-mathites.html': 'Το aitools4kids.gr είναι δωρεάν εκπαιδευτική πλατφόρμα για μαθητές, γονείς και εκπαιδευτικούς. Συνδέει την ελληνική σχολική ύλη με AI Μελέτη, Χάρτη Εξάσκησης και κατάλληλα AI εργαλεία ανά ηλικία και μάθημα.',
            'ai-gia-dimotiko.html': 'Για μαθητές Δημοτικού, το aitools4kids.gr προτείνει απλές, επιβλεπόμενες χρήσεις AI και δραστηριότητες πάνω στη σχολική ύλη, με έμφαση στην κατανόηση και στην προσπάθεια του παιδιού.',
            'ai-gia-gymnasio.html': 'Για μαθητές Γυμνασίου, το aitools4kids.gr συνδέει την ελληνική σχολική ύλη με AI Μελέτη, εξάσκηση και επιλεγμένα εργαλεία AI κατάλληλα για την ηλικία, με έμφαση στην κατανόηση και όχι στην έτοιμη λύση.',
            'ai-gia-lykeio.html': 'Για μαθητές Λυκείου και ΕΠΑΛ, το aitools4kids.gr συνδέει την ελληνική σχολική ύλη με AI Μελέτη, επανάληψη και εργαλεία AI ανά μάθημα, με στόχο οργανωμένη εξάσκηση και υπεύθυνη χρήση.',
            'ai-gia-ekpaideftikous.html': 'Το aitools4kids.gr προσφέρει σε εκπαιδευτικούς δωρεάν υλικό και εργαλεία AI συνδεδεμένα με την ελληνική σχολική ύλη, για προετοιμασία μαθήματος, εξάσκηση, αξιολόγηση και υπεύθυνη χρήση στην τάξη.',
            'ai-me-elliniki-sxoliki-yli.html': 'Το aitools4kids.gr συνδέει εργαλεία AI με την επίσημη ελληνική σχολική ύλη και τα σχολικά βιβλία, ώστε η μελέτη και η εξάσκηση να βασίζονται σε συγκεκριμένες ενότητες αντί για γενικές απαντήσεις.',
            'special-education.html': 'Το aitools4kids.gr συγκεντρώνει εκπαιδευτικές διαδρομές και εργαλεία AI για μαθητές Ειδικής Εκπαίδευσης, με επιλογές ανά σχολικό πλαίσιο και ανάγκη μάθησης.',
            'preschool.html': 'Για παιδιά προσχολικής ηλικίας, το aitools4kids.gr προσφέρει δραστηριότητες και εισαγωγικές χρήσεις AI με καθοδήγηση ενήλικα, προσαρμοσμένες στη μάθηση μέσα από εικόνα, κίνηση και παιχνίδι.',
            'ai-gia-goneis.html': 'Το aitools4kids.gr βοηθά γονείς να επιλέγουν κατάλληλα AI εργαλεία ανά ηλικία και σχολική ανάγκη και να καθοδηγούν τη χρήση τους χωρίς να υποκαθίσταται η προσπάθεια του παιδιού.',
            'ai-gia-istoria.html': 'Το aitools4kids.gr βοηθά τους μαθητές να χρησιμοποιούν AI στην Ιστορία πάνω στη σχολική ύλη, με έλεγχο πηγών και έμφαση στην κατανόηση αντί στην αντιγραφή έτοιμων απαντήσεων.'
          }

          block_tpl = '<aside class="quick-answer" aria-label="Σύντομη απάντηση"><strong>Σύντομη απάντηση</strong><p>{text}</p></aside>'
          patched = []
          skipped = []
          missing = []

          def insert_block(html, block):
              # Preferred: after the first hero section, before article/main content.
              patterns = [
                  r'(</section>\s*)(<article\b)',
                  r'(</section>\s*)(<main\b)',
                  r'(<article\b[^>]*>)',
                  r'(<main\b[^>]*>)'
              ]
              for idx, pat in enumerate(patterns):
                  m = re.search(pat, html, flags=re.I|re.S)
                  if not m:
                      continue
                  if idx < 2:
                      return html[:m.start()] + m.group(1) + block + m.group(2) + html[m.end():]
                  return html[:m.end()] + block + html[m.end():]
              return None

          for filename, text in summaries.items():
              p = Path(filename)
              if not p.exists():
                  missing.append(filename)
                  continue
              html = p.read_text(encoding='utf-8')
              if 'class="quick-answer"' in html:
                  skipped.append(filename)
                  continue
              updated = insert_block(html, block_tpl.format(text=text))
              if not updated:
                  skipped.append(filename + ' (no insertion point)')
                  continue
              p.write_text(updated, encoding='utf-8')
              patched.append(filename)

          css_path = Path('seo-guide.css')
          if css_path.exists():
              css = css_path.read_text(encoding='utf-8')
              if '.quick-answer' not in css:
                  css += '''\n\n/* Concise answer block for readers and AI retrieval */\n.quick-answer{max-width:860px;margin:0 auto 28px;padding:15px 18px;border:1px solid #dfe7ee;border-left:4px solid #2e6f5e;border-radius:12px;background:#f7faf9;color:inherit;line-height:1.55}\n.quick-answer strong{display:block;margin:0 0 5px;font-size:.92rem}\n.quick-answer p{margin:0}\n@media(max-width:640px){.quick-answer{margin-bottom:22px;padding:13px 15px;border-radius:10px}}\n'''
                  css_path.write_text(css, encoding='utf-8')

          # Remove this one-off workflow from the resulting commit.
          wf = Path('.github/workflows/apply-quick-answer.yml')
          if wf.exists():
              wf.unlink()

          print('PATCHED:', ', '.join(patched) or 'none')
          print('SKIPPED:', ', '.join(skipped) or 'none')
          print('MISSING:', ', '.join(missing) or 'none')
          if not patched:
              raise SystemExit('No pages were patched')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add quick-answer blocks to informational pages"
          git push origin main
