name: Apply trust date and positioning fix

on:
  push:
    branches:
      - fix/trust-date-positioning-20260909

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/trust-date-positioning-20260909
          fetch-depth: 0

      - name: Apply source corrections
        run: python3 scripts/apply-trust-positioning-fix.py

      - name: Validate source corrections
        shell: bash
        run: |
          set -euo pipefail
          node --check site-meta.js
          node --check app.js
          node --check pwa.js
          node --check site-postfix.js
          node --check navigator-home.js
          node --check report-link.js
          node --check september-2026-tool-audit.js
          node --check gel-2026-2027-update.js
          node tests/date-architecture-smoke.mjs

      - name: Commit source corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aitools4kids-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.js site-meta.js gel-2026-2027-update.js pwa.js site-postfix.js september-2026-tool-audit.js report-link.js navigator-home.js navigator-home.css tests/home-positioning-smoke.mjs tests/date-architecture-smoke.mjs docs/tutor-consolidation-audit.md docs/special-education-status.md scripts/apply-trust-positioning-fix.py
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Fix review-date architecture and navigator-first homepage"
          git push origin HEAD:fix/trust-date-positioning-20260909
