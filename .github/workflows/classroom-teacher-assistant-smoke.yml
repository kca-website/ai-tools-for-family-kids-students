name: Classroom teacher assistant smoke

on:
  push:
    branches:
      - work/classroom-teacher-assistant
      - preview/classroom-teacher-assistant
  pull_request:
    paths:
      - 'classroom.html'
      - 'classroom-teacher-tools.css'
      - 'teacher-assistant.html'
      - 'tests/classroom-teacher-assistant-smoke.mjs'
      - '.github/workflows/classroom-teacher-assistant-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check inline and standalone JavaScript
        run: |
          node --check tests/classroom-teacher-assistant-smoke.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('teacher-assistant.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
          if not scripts: raise SystemExit('teacher assistant inline script missing')
          Path('/tmp/teacher-assistant-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/teacher-assistant-inline.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/classroom-teacher-server.log 2>&1 &
          sleep 2
      - name: Run educator navigator and assistant smoke
        run: node tests/classroom-teacher-assistant-smoke.mjs
