name: Apply classroom teacher tools

on:
  push:
    branches:
      - work/classroom-teacher-assistant

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/classroom-teacher-assistant
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patch
        run: python scripts/apply-classroom-teacher-tools.py
      - name: Commit generated source change
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classroom.html seo-sitemap.xml
          git commit -m "Integrate educator task navigator into Classroom View"
          git push origin HEAD:work/classroom-teacher-assistant
