name: Fix Back to Zones navigation

on:
  push:
    paths:
      - '.github/workflows/fix-back-to-zones.yml'

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add hard navigation fallback and verify
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<button type="button" id="backToZones" data-i18n="backToZones">Πίσω σε όλες τις ζώνες</button>'
          new = '<button type="button" id="backToZones" data-i18n="backToZones" onclick="window.location.href=\'/\'">Πίσω σε όλες τις ζώνες</button>'

          if old not in text:
              raise SystemExit('Expected backToZones button markup not found; aborting.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          check = path.read_text(encoding='utf-8')
          if 'id="backToZones"' not in check or "onclick=\"window.location.href='/'\"" not in check:
              raise SystemExit('Back-to-zones fallback verification failed.')

      - name: Remove one-time workflow and commit fix
        run: |
          rm .github/workflows/fix-back-to-zones.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-back-to-zones.yml
          git commit -m "Fix Back to Zones navigation"
          git push origin main
