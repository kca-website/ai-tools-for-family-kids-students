name: One-time Puter compatibility hotfix

on:
  push:
    paths:
      - '.github/workflows/hotfix-puter-temperature.yml'

permissions:
  contents: write

jobs:
  patch-tutor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove unsupported temperature and improve error message
        shell: python
        run: |
          from pathlib import Path

          path = Path('tutor.js')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace('        temperature: 0.15,\n', '')
          text = text.replace(
              '      callFailed: "Η κλήση απέτυχε. Έλεγξε τη σύνδεση Puter και δοκίμασε ξανά.",',
              '      callFailed: "Ο βοηθός δεν μπόρεσε να απαντήσει αυτή τη στιγμή. Δοκίμασε ξανά σε λίγο.",'
          )
          text = text.replace(
              '      callFailed: "The call failed. Check your Puter connection and try again.",',
              '      callFailed: "The helper could not answer right now. Please try again in a moment.",'
          )

          if text == original:
              raise SystemExit('No expected tutor.js changes found; aborting hotfix.')
          if 'temperature: 0.15' in text:
              raise SystemExit('temperature parameter still present; aborting hotfix.')

          path.write_text(text, encoding='utf-8')
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutor.js
          git commit -m "Fix Puter model compatibility"
          git push origin main
