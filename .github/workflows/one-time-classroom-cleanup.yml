name: One-time Classroom menu and punctuation cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-classroom-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          index = read('index.html')
          if 'classroom-menu-link' not in index:
              old = "\n".join([
                  '      <div class="lang-toggle" role="group" aria-label="Language switch">',
                  '        <button type="button" id="langEl" class="active" data-lang="el">ΕΛ</button>',
                  '        <button type="button" id="langEn" data-lang="en">EN</button>',
                  '      </div>',
              ])
              new = "\n".join([
                  '      <div class="site-header__actions">',
                  '        <a class="classroom-menu-link" href="/classroom.html" aria-label="Για την τάξη / Classroom">',
                  '          <span aria-hidden="true">🏫</span>',
                  '          <span class="classroom-menu-link__text" data-i18n="menuClassroom">Για την τάξη</span>',
                  '        </a>',
                  '        <div class="lang-toggle" role="group" aria-label="Language switch">',
                  '          <button type="button" id="langEl" class="active" data-lang="el">ΕΛ</button>',
                  '          <button type="button" id="langEn" data-lang="en">EN</button>',
                  '        </div>',
                  '      </div>',
              ])
              if old not in index:
                  raise SystemExit('Expected language-toggle block not found in index.html')
              index = index.replace(old, new, 1)

          index = index.replace(
              'Τελευταίος έλεγχος εργαλείων: 5 Σεπτεμβρίου 2026',
              'Τελευταίος έλεγχος στοιχείων εργαλείων: 5 Σεπτεμβρίου 2026'
          )
          write('index.html', index)

          styles = read('styles.css')
          marker = '/* ---------- Header utility link: Classroom ---------- */'
          if marker not in styles:
              css = "\n".join([
                  '', '', marker,
                  '.site-header__actions {',
                  '  display: flex;',
                  '  align-items: center;',
                  '  gap: 8px;',
                  '}',
                  '',
                  '.classroom-menu-link {',
                  '  display: inline-flex;',
                  '  align-items: center;',
                  '  gap: 6px;',
                  '  min-height: 36px;',
                  '  padding: 6px 10px;',
                  '  border: 1px solid var(--color-border);',
                  '  border-radius: var(--radius-sm);',
                  '  background: var(--color-surface);',
                  '  color: var(--color-text);',
                  '  text-decoration: none;',
                  '  font-size: .82rem;',
                  '  font-weight: 700;',
                  '  white-space: nowrap;',
                  '}',
                  '',
                  '.classroom-menu-link:hover {',
                  '  border-color: var(--color-accent);',
                  '  background: rgba(46, 111, 94, 0.06);',
                  '}',
                  '',
                  '.classroom-menu-link:focus-visible {',
                  '  outline: 3px solid rgba(59, 130, 196, 0.32);',
                  '  outline-offset: 2px;',
                  '}',
                  '',
                  '@media (max-width: 620px) {',
                  '  .site-header__inner { gap: 8px; }',
                  '  .site-title { font-size: .92rem; }',
                  '  .classroom-menu-link { width: 36px; padding: 6px; justify-content: center; }',
                  '  .classroom-menu-link__text { display: none; }',
                  '}',
                  '',
              ])
              styles += css
          write('styles.css', styles)

          app = read('app.js')
          if 'menuClassroom:' not in app:
              if '    el: {\n' not in app or '    en: {\n' not in app:
                  raise SystemExit('Expected STRINGS language blocks not found in app.js')
              app = app.replace('    el: {\n', '    el: {\n      menuClassroom: "Για την τάξη",\n', 1)
              app = app.replace('    en: {\n', '    en: {\n      menuClassroom: "Classroom",\n', 1)
          app = app.replace(
              'Τελευταίος έλεγχος εργαλείων: 5 Σεπτεμβρίου 2026',
              'Τελευταίος έλεγχος στοιχείων εργαλείων: 5 Σεπτεμβρίου 2026'
          )
          app = app.replace(
              'Tools last checked: 5 September 2026',
              'Tool information last checked: 5 September 2026'
          )
          write('app.js', app)

          postfix = read('site-postfix.js')
          postfix = postfix.replace(
              'Τελευταίος έλεγχος εργαλείων: 5 Σεπτεμβρίου 2026',
              'Τελευταίος έλεγχος στοιχείων εργαλείων: 5 Σεπτεμβρίου 2026'
          )
          postfix = postfix.replace(
              'Tools last checked: 5 September 2026',
              'Tool information last checked: 5 September 2026'
          )
          write('site-postfix.js', postfix)

          targets = [
              'classroom.html',
              'methodology.html',
              'xartis-ylis.html',
              'special-education.html',
          ]
          for path in targets:
              text = read(path)
              text = text.replace(' — ', ': ')
              text = text.replace('—', '–')
              write(path, text)

          for path in targets:
              if '—' in read(path):
                  raise SystemExit(f'Em-dash still present in {path}')
          if '/classroom.html' not in read('index.html'):
              raise SystemExit('Classroom link missing after edit')
          if 'menuClassroom: "Για την τάξη"' not in read('app.js'):
              raise SystemExit('Greek Classroom translation missing')
          if 'menuClassroom: "Classroom"' not in read('app.js'):
              raise SystemExit('English Classroom translation missing')
          PY

          rm -f .github/workflows/one-time-classroom-cleanup.yml

      - name: Commit focused changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add Classroom menu link and clean visible punctuation"
          git push origin HEAD:main
