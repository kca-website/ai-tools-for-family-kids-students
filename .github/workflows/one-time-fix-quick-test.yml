name: One-time quick test PWA fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[quick-test-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix installed-app quick test action
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pwa-core.js')
          t=p.read_text(encoding='utf-8')
          old='''        body.pwa-standalone #zoneSelectView .hero__quiz-cta-wrap,\n        body.pwa-standalone #zoneSelectView .hero__ai-help{display:none!important;}'''
          new='''        body.pwa-standalone #zoneSelectView .hero__quiz-cta-wrap,\n        body.pwa-standalone #zoneSelectView .hero__ai-help{display:none!important;}\n        body.pwa-standalone.pwa-show-quiz-picker #zoneSelectView .hero__quiz-cta-wrap{display:block!important;}\n        body.pwa-standalone.pwa-show-quiz-picker #heroQuizCtaBtn{display:none!important;}'''
          if old not in t:
              raise SystemExit('CSS target not found')
          t=t.replace(old,new,1)

          old2='''    if(action==="quiz"){\n      const btn=document.getElementById("heroQuizCtaBtn");\n      if(btn){\n        btn.click();\n        setTimeout(()=>document.getElementById("heroQuizPicker")?.scrollIntoView({behavior:"smooth",block:"center"}),80);\n      }\n      return;\n    }'''
          new2='''    if(action==="quiz"){\n      const btn=document.getElementById("heroQuizCtaBtn");\n      const picker=document.getElementById("heroQuizPicker");\n      if(btn && picker){\n        if(isStandalone()) document.body.classList.add("pwa-show-quiz-picker");\n        if(picker.hidden) btn.click();\n        setTimeout(()=>picker.scrollIntoView({behavior:"smooth",block:"center"}),80);\n      }\n      return;\n    }'''
          if old2 not in t:
              raise SystemExit('JS target not found')
          t=t.replace(old2,new2,1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/one-time-fix-quick-test.yml
          git config user.name "kca-website"
          git config user.email "kkoustas@gmail.com"
          git add -A
          git commit -m "[quick-test-fix] Make PWA quick test visible"
          git push