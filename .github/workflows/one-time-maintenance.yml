name: One-time site maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-maintenance.yml'

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize footer dates and defer ordered scripts
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('app.js'): [
                  ('Τελευταίος έλεγχος εργαλείων: 27 Αυγούστου 2026', 'Τελευταίος έλεγχος εργαλείων: 30 Αυγούστου 2026'),
                  ('Tools last checked: August 27, 2026', 'Tools last checked: August 30, 2026'),
              ],
              Path('site-postfix.js'): [
                  ('Τελευταίος έλεγχος εργαλείων: 29 Αυγούστου 2026', 'Τελευταίος έλεγχος εργαλείων: 30 Αυγούστου 2026'),
                  ('Tools last checked: 29 August 2026', 'Tools last checked: 30 August 2026'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text == original:
                  print(f'No footer-date change needed in {path}')
              else:
                  path.write_text(text, encoding='utf-8')
                  print(f'Updated footer dates in {path}')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          ordered_scripts = [
              '/data.js',
              '/curriculum-data.js',
              '/quiz-data.js',
              '/learning-paths-data.js',
              '/curriculum-2026-2027-expansion.js',
              '/official-curriculum-data.js',
              '/gel-2026-2027-update.js',
              '/guide-data.js',
              '/accessibility-data.js',
              '/site-integrity-overrides.js',
              '/tutor.js',
              '/app.js',
              '/site-postfix.js',
          ]
          for src in ordered_scripts:
              old = f'<script src="{src}"></script>'
              new = f'<script defer src="{src}"></script>'
              text = text.replace(old, new)
          index.write_text(text, encoding='utf-8')

      - name: Syntax checks
        run: |
          node --check app.js
          node --check site-postfix.js
          node --check site-integrity-overrides.js
          node --check tutor.js
          grep -q 'Τελευταίος έλεγχος εργαλείων: 30 Αυγούστου 2026' app.js
          grep -q 'Τελευταίος έλεγχος εργαλείων: 30 Αυγούστου 2026' site-postfix.js
          grep -q '<script defer src="/app.js"></script>' index.html

      - name: Commit maintenance and remove one-time workflow
        run: |
          rm .github/workflows/one-time-maintenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js site-postfix.js index.html .github/workflows/one-time-maintenance.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Normalize site integrity metadata and script loading"
          git push