name: One-time UX methodology integration
on:
  push:
    paths:
      - '.github/workflows/one-time-ux-methodology.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UX integration
        run: python3 scripts/one_time_ux.py
      - name: Check JavaScript
        run: node --check site-postfix.js
      - name: Commit changes
        run: |
          git config user.name "kca-website"
          git config user.email "kkoustas@gmail.com"
          git add site-postfix.js tools sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Improve onboarding, learning-path flow and trust links"
            git push
          fi
      - name: Cleanup temporary files
        run: |
          git pull --rebase
          git rm .github/workflows/one-time-ux-methodology.yml scripts/one_time_ux.py
          git commit -m "Remove temporary UX integration files"
          git push
