name: One-time wording cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[wording-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean visible wording
        run: |
          python - <<'PY'
          from pathlib import Path

          exts = {'.html', '.js', '.json', '.md', '.txt', '.webmanifest'}
          skip_dirs = {'.git', '.github'}
          issue_url = 'https://github.com/kca-website/ai-tools-for-family-kids-students/issues/new'

          exact_replacements = {
              'Μπορείς να ανοίξεις μια σύντομη αναφορά στο δημόσιο repository του project και να γράψεις ποια σελίδα ή πληροφορία χρειάζεται έλεγχο.':
              'Μπορείς να στείλεις μια σύντομη αναφορά από τη φόρμα του site και να γράψεις ποια σελίδα ή πληροφορία χρειάζεται έλεγχο.',
              'We want errors corrected quickly. You can open a short report in the project’s public repository and tell us which page or claim needs review.':
              'We want errors corrected quickly. You can send a short report through the site form and tell us which page or claim needs review.',
              'Στείλε μου μια σύντομη αναφορά. Δεν χρειάζεται λογαριασμός και δεν δημοσιεύεται τίποτα στο GitHub.':
              'Στείλε μου μια σύντομη αναφορά. Δεν χρειάζεται λογαριασμός και η αναφορά στέλνεται ιδιωτικά.',
              'Send a short report. No account is required and nothing is posted publicly on GitHub.':
              'Send a short report. No account is required and your report is sent privately.',
          }

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in exts:
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text

              # Remove the punctuation pattern that makes generated copy feel formulaic.
              # Numeric ranges such as 13–14 are intentionally left untouched.
              text = text.replace(' — ', ': ')
              text = text.replace(' – ', ': ')

              # All public error-report links now use the private on-site form.
              text = text.replace(issue_url, '/report-error.html')

              for old, new in exact_replacements.items():
                  text = text.replace(old, new)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # If a report is opened from an older direct link, use same-site referrer when possible.
          report = Path('report-error.html')
          if report.exists():
              text = report.read_text(encoding='utf-8')
              needle = 'if(source) document.getElementById("sourceUrl").value=source;'
              repl = '''if(source) document.getElementById("sourceUrl").value=source;\n      else if(document.referrer && document.referrer.startsWith(location.origin)){\n        document.getElementById("sourceUrl").value=document.referrer;\n      }'''
              if needle in text:
                  text = text.replace(needle, repl)
                  report.write_text(text, encoding='utf-8')
                  if str(report) not in changed:
                      changed.append(str(report))

          print('Changed files:', len(changed))
          for p in changed:
              print(p)
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/one-time-wording-cleanup.yml
          git config user.name "kca-website"
          git config user.email "kkoustas@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "[wording-cleanup] Clean site-wide wording and report links"
          git push
