name: One-time wording polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[wording-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish prose and audit punctuation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          exts={'.html','.js','.json','.md','.txt','.webmanifest'}
          changed=[]
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in exts or '.git' in path.parts or '.github' in path.parts:
                  continue
              try: text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              old=text

              # No stylistic long dashes. Keep en dashes only inside numeric ranges such as 13–14.
              text=text.replace('—', ':')
              text=re.sub(r'(?<!\d)–', ':', text)
              text=re.sub(r'–(?!\d)', ':', text)

              # Natural prose after the first punctuation cleanup.
              text=text.replace(': όχι ', ', όχι ')
              text=text.replace(': not ', ', not ')
              text=text.replace('σκέφτεται: όχι απλώς', 'σκέφτεται και όχι απλώς')
              text=text.replace('think: not simply', 'think, rather than simply')
              text=text.replace('Ανεξάρτητο έργο: δεν αποτελεί συνεργασία με τον πάροχο.', 'Ανεξάρτητο έργο. Δεν αποτελεί συνεργασία με τον πάροχο.')
              text=text.replace('Independent project: not affiliated with the provider.', 'Independent project. Not affiliated with the provider.')
              text=text.replace('AI Βοήθεια: aitools4kids.gr', 'AI Βοήθεια του aitools4kids.gr')
              text=text.replace('Google Arts & Culture: Learn', 'Google Arts & Culture Learn')
              text=text.replace('<title>Πολιτική Απορρήτου - AI Tools for Kids</title>', '<title>Πολιτική Απορρήτου | AI Tools for Kids</title>')

              if text!=old:
                  path.write_text(text,encoding='utf-8')
                  changed.append(str(path))

          # Audit: no em dash anywhere; en dash allowed only digit-to-digit ranges.
          em=[]; bad_en=[]; old_issue=[]
          issue='github.com/kca-website/ai-tools-for-family-kids-students/issues/new'
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in exts or '.git' in path.parts or '.github' in path.parts:
                  continue
              try: t=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if '—' in t: em.append(str(path))
              if re.search(r'(?<!\d)–|–(?!\d)',t): bad_en.append(str(path))
              if issue in t: old_issue.append(str(path))
          print('Changed:',len(changed))
          print('Remaining em dash files:',em)
          print('Remaining stylistic en dash files:',bad_en)
          print('Remaining old GitHub report links:',old_issue)
          if em or bad_en or old_issue:
              raise SystemExit(1)
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/one-time-wording-polish.yml
          git config user.name "kca-website"
          git config user.email "kkoustas@gmail.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[wording-polish] Final human-tone wording pass"
          git push
