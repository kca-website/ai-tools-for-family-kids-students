name: Patch Study resolver wave 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-study-resolver-wave2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply remaining Study resolver fixes
        run: node scripts/patch-study-resolver-wave2.mjs
      - name: Syntax check resolver
        run: node --check api/schoolbook-source.js
      - name: Commit resolver
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/schoolbook-source.js
          git commit -m "Resolve remaining Study grounding exceptions"
          git push origin HEAD:main
