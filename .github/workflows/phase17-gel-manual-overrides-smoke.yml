name: Phase 17 GEL manual overrides

on:
  pull_request:
    branches:
      - main
    paths:
      - 'gel-schoolbook-manual-overrides-2026-2027.js'
      - 'gel-schoolbook-source-map-2026-2027.js'
      - 'api/schoolbook-source.js'
      - 'tests/phase17-gel-manual-overrides-smoke.mjs'
      - '.github/workflows/phase17-gel-manual-overrides-smoke.yml'

jobs:
  manual-overrides:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install runtime dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Run Phase 17 live override audit
        run: node tests/phase17-gel-manual-overrides-smoke.mjs
