name: Phase 21 Economics grounding

on:
  pull_request:
    branches:
      - main
    paths:
      - 'gel-schoolbook-manual-overrides-2026-2027.js'
      - 'gel-schoolbook-source-map-2026-2027.js'
      - 'api/schoolbook-source.js'
      - 'tests/phase18-gel-grounding-coverage-smoke.mjs'
      - 'tests/phase19-gel-manual-discovery-smoke.mjs'
      - 'tests/phase21-economics-grounding-smoke.mjs'
      - '.github/workflows/phase21-economics-grounding-smoke.yml'

jobs:
  economics-grounding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install runtime dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Run Phase 21 Economics grounding audit
        run: node tests/phase21-economics-grounding-smoke.mjs
