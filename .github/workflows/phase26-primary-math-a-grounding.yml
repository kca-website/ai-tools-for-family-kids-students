name: Phase 26 Primary Math A grounding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase26-primary-math-a-grounding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wire complete Primary School source bundles into runtime and audit
        shell: python
        run: |
          from pathlib import Path

          endpoint = Path('api/schoolbook-source.js')
          text = endpoint.read_text(encoding='utf-8')

          marker = '''let OFFICIAL_PDF_TEXT = null;\n'''
          insert = '''let PRIMARY_COMPLETE_SOURCES = null;\ntry {\n  PRIMARY_COMPLETE_SOURCES = require("../primary-schoolbook-complete-sources-2026-2027.js");\n} catch (_) {\n  PRIMARY_COMPLETE_SOURCES = null;\n}\n\n'''
          if 'PRIMARY_COMPLETE_SOURCES' not in text:
              if marker not in text:
                  raise SystemExit('endpoint require marker not found')
              text = text.replace(marker, insert + marker, 1)

          marker2 = '''  let directUrls = characterChapter ? [characterChapter.url] : resolveDirectSourceUrls(subject, topic);\n'''
          insert2 = '''  let directUrls = characterChapter ? [characterChapter.url] : resolveDirectSourceUrls(subject, topic);\n  if (!directUrls.length) {\n    const primaryComplete = PRIMARY_COMPLETE_SOURCES?.get?.(subject, topic) || null;\n    if (primaryComplete?.urls?.length && primaryComplete.urls.every(catalogHtmlSourceAllowed)) {\n      directUrls = [...primaryComplete.urls];\n    }\n  }\n'''
          if 'const primaryComplete = PRIMARY_COMPLETE_SOURCES?.get?.(subject, topic)' not in text:
              if marker2 not in text:
                  raise SystemExit('direct URL marker not found')
              text = text.replace(marker2, insert2, 1)

          endpoint.write_text(text, encoding='utf-8')

          audit = Path('scripts/grounding-coverage-report.mjs')
          text = audit.read_text(encoding='utf-8')
          require_marker = "const primary = require('../general-education-book-sections-2026-2027.js');\n"
          require_insert = require_marker + "const primaryComplete = require('../primary-schoolbook-complete-sources-2026-2027.js');\n"
          if "primary-schoolbook-complete-sources-2026-2027.js" not in text:
              text = text.replace(require_marker, require_insert, 1)

          old = '''      const isOfficialHtml = source && /^https:\\/\\/[^/]*ebooks\\.edu\\.gr\\/ebooks\\/v\\/html\\//i.test(String(source));\n      if (isOfficialHtml) {\n'''
          new = '''      const isOfficialHtml = source && /^https:\\/\\/[^/]*ebooks\\.edu\\.gr\\/ebooks\\/v\\/html\\//i.test(String(source));\n      const completeBundle = primaryComplete.get(subjectId, label);\n      const isCompleteBundle = !!completeBundle?.urls?.length && completeBundle.urls.every((url) =>\n        /^https:\\/\\/[^/]*ebooks\\.edu\\.gr\\/ebooks\\/v\\/html\\//i.test(String(url))\n      );\n      if (isOfficialHtml || isCompleteBundle) {\n'''
          if 'const completeBundle = primaryComplete.get(subjectId, label);' not in text:
              if old not in text:
                  raise SystemExit('audit grounding marker not found')
              text = text.replace(old, new, 1)

          audit.write_text(text, encoding='utf-8')

      - name: Validate mapping bundle
        run: |
          node - <<'NODE'
          const sources = require('./primary-schoolbook-complete-sources-2026-2027.js');
          const catalog = require('./general-education-book-sections-2026-2027.js');
          const mathA = catalog.get('math-a-dimotikou');
          if (sources.count !== 9) throw new Error('Expected 9 Math A units');
          if (!mathA || mathA.sections.length !== 9) throw new Error('Expected 9 Math A catalog sections');
          for (const label of mathA.sections) {
            const entry = sources.get('math-a-dimotikou', label);
            if (!entry?.urls?.length) throw new Error('Missing complete bundle: ' + label);
            if (!entry.urls.every(u => /^https:\/\/ebooks\.edu\.gr\/ebooks\/v\/html\/8547\/2156\//.test(u))) {
              throw new Error('Unsafe official URL in ' + label);
            }
          }
          console.log('PRIMARY_MATH_A_COMPLETE_BUNDLES=9');
          NODE
          node --check api/schoolbook-source.js
          node scripts/grounding-coverage-report.mjs > /tmp/grounding.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/grounding.json','utf8'));
          const unresolvedMathA = (r.primary.missing || []).filter(x => x.subjectId === 'math-a-dimotikou');
          if (unresolvedMathA.length !== 0) {
            throw new Error('Math A still has pending sections: ' + JSON.stringify(unresolvedMathA));
          }
          if (r.primary.grounded !== 182 || r.primary.total !== 275 || r.primary.pending !== 93) {
            throw new Error('Unexpected Primary totals: ' + JSON.stringify({grounded:r.primary.grounded,total:r.primary.total,pending:r.primary.pending}));
          }
          console.log('PRIMARY_MATH_A_AUDIT=9/9');
          console.log('PRIMARY_TOTAL=182/275; pending=93');
          NODE

      - name: Commit runtime activation
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/schoolbook-source.js scripts/grounding-coverage-report.mjs
          git commit -m "Ground all 9 Math A primary units from official book pages"
          git push
