name: Phase 27 Primary Math C grounding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase27-primary-math-c-grounding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add complete Math C official source bundles
        shell: python
        run: |
          from pathlib import Path
          p = Path('primary-schoolbook-complete-sources-2026-2027.js')
          text = p.read_text(encoding='utf-8')
          if 'MATH_C_BASE' not in text:
              text = text.replace(
                  'const MATH_B_BASE = "https://ebooks.edu.gr/ebooks/v/html/8547/2164/Mathimatika_B-Dimotikou_html-empl/";\n',
                  'const MATH_B_BASE = "https://ebooks.edu.gr/ebooks/v/html/8547/2164/Mathimatika_B-Dimotikou_html-empl/";\nconst MATH_C_BASE = "https://ebooks.edu.gr/ebooks/v/html/8547/2170/Mathimatika_G-Dimotikou_html-empl/";\n'
              )
          if 'subjectId: "math-c-dimotikou"' not in text:
              block = r''',
  // Mathematics C Primary. The official contents define these complete unit spans;
  // assessment-only chapters 21, 39 and 60 sit between/after units and are excluded.
  {
    subjectId: "math-c-dimotikou",
    label: "1η Ενότητα — Αριθμοί μέχρι το 1.000. Οι τέσσερις πράξεις. Γεωμετρικά σχήματα",
    urls: urls(MATH_C_BASE, "1", range(1, 7)),
    reviewBasis: "Official book contents: unit 1 chapters 1-7",
    reviewedAt: "2026-10-04"
  },
  {
    subjectId: "math-c-dimotikou",
    label: "2η Ενότητα — Μετρήσεις μήκους. Πράξεις αφαίρεσης και πολλαπλασιασμού. Στερεά σώματα",
    urls: urls(MATH_C_BASE, "2", range(8, 13)),
    reviewBasis: "Official book contents: unit 2 chapters 8-13",
    reviewedAt: "2026-10-04"
  },
  {
    subjectId: "math-c-dimotikou",
    label: "3η Ενότητα — Αριθμοί μέχρι το 3.000. Οι τέσσερις πράξεις. Χαράξεις. Ορθές γωνίες",
    urls: urls(MATH_C_BASE, "3", range(14, 20)),
    reviewBasis: "Official book contents: unit 3 chapters 14-20",
    reviewedAt: "2026-10-04"
  },
  {
    subjectId: "math-c-dimotikou",
    label: "4η Ενότητα — Εισαγωγή στα απλά κλάσματα",
    urls: urls(MATH_C_BASE, "4", range(22, 26)),
    reviewBasis: "Official book contents: unit 4 chapters 22-26",
    reviewedAt: "2026-10-04"
  },
  {
    subjectId: "math-c-dimotikou",
    label: "5η Ενότητα — Προσθέσεις και αφαιρέσεις. Αλγόριθμος του πολλαπλασιασμού",
    urls: urls(MATH_C_BASE, "5", range(27, 32)),
    reviewBasis: "Official book contents: unit 5 chapters 27-32",
    reviewedAt: "2026-10-04"
  },
  {
    subjectId: "math-c-dimotikou",
    label: "6η Ενότητα — Εισαγωγή στους δεκαδικούς αριθμούς",
    urls: urls(MATH_C_BASE, "6", range(33, 38)),
    reviewBasis: "Official book contents: unit 6 chapters 33-38",
    reviewedAt: "2026-10-04"
  },
  {
    subjectId: "math-c-dimotikou",
    label: "7η Ενότητα — Αριθμοί μέχρι το 7.000. Μέτρηση μάζας. Παζλ, πλακόστρωτα, μωσαϊκά, συμμετρία",
    urls: urls(MATH_C_BASE, "7", range(40, 45)),
    reviewBasis: "Official book contents: unit 7 chapters 40-45",
    reviewedAt: "2026-10-04"
  },
  {
    subjectId: "math-c-dimotikou",
    label: "8η Ενότητα — Πολλαπλασιασμοί και διαιρέσεις. Μοτίβα. Μέτρηση χρόνου και επιφάνειας",
    urls: urls(MATH_C_BASE, "8", range(46, 52)),
    reviewBasis: "Official book contents: unit 8 chapters 46-52",
    reviewedAt: "2026-10-04"
  },
  {
    subjectId: "math-c-dimotikou",
    label: "9η Ενότητα — Αριθμοί μέχρι το 10.000. Κλάσματα και δεκαδικοί. Πράξεις. Γεωμετρία",
    urls: urls(MATH_C_BASE, "9", range(53, 59)),
    reviewBasis: "Official book contents: unit 9 chapters 53-59",
    reviewedAt: "2026-10-04"
  }'''
              text = text.replace('\n]);\n\nfunction get(', block + '\n]);\n\nfunction get(', 1)
          p.write_text(text, encoding='utf-8')

      - name: Validate Math C coverage
        run: |
          node - <<'NODE'
          const catalog = require('./general-education-book-sections-2026-2027.js');
          const sources = require('./primary-schoolbook-complete-sources-2026-2027.js');
          const row = catalog.get('math-c-dimotikou');
          if (!row || row.sections.length !== 9) throw new Error('Math C catalog mismatch');
          for (const label of row.sections) {
            const entry = sources.get('math-c-dimotikou', label);
            if (!entry?.urls?.length) throw new Error('Missing Math C source bundle: ' + label);
            if (!entry.urls.every(u => /^https:\/\/ebooks\.edu\.gr\/ebooks\/v\/html\/8547\/2170\/Mathimatika_G-Dimotikou_html-empl\/index[1-9]_\d+\.html$/.test(u))) {
              throw new Error('Unsafe Math C URL: ' + JSON.stringify(entry.urls));
            }
          }
          console.log('PRIMARY_MATH_C_COMPLETE_BUNDLES=9');
          NODE
          node scripts/grounding-coverage-report.mjs > /tmp/grounding.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/grounding.json','utf8'));
          const missing = (r.primary.missing || []).filter(x => x.subjectId === 'math-c-dimotikou');
          if (missing.length) throw new Error('Math C pending: ' + JSON.stringify(missing));
          console.log('PRIMARY_MATH_C_AUDIT=9/9');
          console.log(`PRIMARY_TOTAL=${r.primary.grounded}/${r.primary.total}; pending=${r.primary.pending}`);
          NODE

      - name: Commit verified Math C bundles
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add primary-schoolbook-complete-sources-2026-2027.js
          git commit -m "Ground all 9 Math C primary units from official book pages"
          git push
