name: Practice Map copy polish

on:
  push:
    branches:
      - fix/practice-map-source-of-truth

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/practice-map-source-of-truth
      - name: Polish raw static Practice Map copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'Δωρεάν, δίγλωσσος οδηγός AI για Δημοτικό, Γυμνάσιο και Λύκειο: Χάρτη Εξάσκησης, learning paths,',
              'Δωρεάν, δίγλωσσος οδηγός AI για Δημοτικό, Γυμνάσιο και Λύκειο: Χάρτης Εξάσκησης, learning paths,'
          )
          s = s.replace(
              'Ο οδηγός, τα εργαλεία και το διαγνωστικό δεν χρησιμοποιούν cookies ούτε απαιτούν λογαριασμό. Μόνο η προαιρετική AI Βοήθεια χρησιμοποιεί Puter όταν επιλέξεις να συνδεθείς.',
              'Ο οδηγός, τα εργαλεία και ο Χάρτης Εξάσκησης δεν χρησιμοποιούν cookies ούτε απαιτούν λογαριασμό. Η πρόοδος του Χάρτη μπορεί να αποθηκευτεί μόνο τοπικά στη συσκευή σου. Μόνο η προαιρετική AI Βοήθεια χρησιμοποιεί Puter: όταν επιλέξεις να συνδεθείς, ισχύουν οι όροι και η πολιτική απορρήτου του Puter.'
          )
          s = s.replace('Χάρτης Εξάσκησης 2 λεπτών για να δεις', 'Χάρτης Εξάσκησης των 2 λεπτών για να δεις')
          p.write_text(s, encoding='utf-8')

          p = Path('ai-ergaleia-gia-mathites.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('τον Χάρτη Εξάσκησης 2 λεπτών', 'τον Χάρτη Εξάσκησης των 2 λεπτών')
          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          grep -n 'Λύκειο: Χάρτη Εξάσκησης' index.html && exit 1 || true
          grep -n 'τα εργαλεία και το διαγνωστικό' index.html && exit 1 || true
          grep -n 'Χάρτη Εξάσκησης 2 λεπτών' ai-ergaleia-gia-mathites.html && exit 1 || true

      - name: Commit copy polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ai-ergaleia-gia-mathites.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Polish Practice Map source copy'
          git push origin HEAD:fix/practice-map-source-of-truth
