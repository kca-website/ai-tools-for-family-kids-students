name: Final Practice Map cleanup

on:
  push:
    branches:
      - fix/practice-map-source-of-truth

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/practice-map-source-of-truth
          fetch-depth: 0

      - name: Normalize remaining user-facing Practice Map copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'pwa-core.js': [
              ('Διαγνωστικός = τι θέλει εξάσκηση', 'Χάρτης Εξάσκησης = τι θέλει εξάσκηση'),
            ],
            'site-postfix.js': [
              ('Μπορείς επίσης να ξανακάνεις τον Διαγνωστικό αργότερα', 'Μπορείς επίσης να ξανακάνεις τον Χάρτη Εξάσκησης αργότερα'),
              ('Κάνε πρώτα τον Διαγνωστικό Χάρτη των 2 λεπτών.', 'Ξεκίνα με τον Χάρτη Εξάσκησης των 2 λεπτών.'),
              ("Κάνε το διαγνωστικό (2') →", 'Άνοιξε τον Χάρτη Εξάσκησης →'),
            ],
            'index.html': [
              ('Practice Map (Χάρτης Εξάσκησης Μάθησης)', 'Practice Map (Χάρτης Εξάσκησης)'),
            ],
            'quiz-data.js': [
              ('Ο Χάρτης Εξάσκησης Μάθησης', 'Ο Χάρτης Εξάσκησης'),
            ],
            'site-integrity-overrides.js': [
              ('Ο Χάρτης Εξάσκησης Μάθησης', 'Ο Χάρτης Εξάσκησης'),
            ],
          }

          changed = []
          for filename, pairs in replacements.items():
            p = Path(filename)
            old = p.read_text(encoding='utf-8')
            new = old
            for src, dst in pairs:
              new = new.replace(src, dst)
            if new != old:
              p.write_text(new, encoding='utf-8')
              changed.append(filename)

          print('changed:', ', '.join(changed) if changed else '<none>')
          PY

      - name: Verify no legacy user-facing branding remains
        shell: bash
        run: |
          set -euo pipefail
          files=(app.js index.html methodology.html ai-ergaleia-gia-mathites.html site-postfix.js pwa-core.js quiz-data.js site-integrity-overrides.js gel-2026-2027-update.js curriculum-2026-2027-expansion.js report-error.html)
          if grep -nE 'Διαγνωστικός Χάρτης|Diagnostic Map|Learning Compass|Χάρτης Εξάσκησης Μάθησης' "${files[@]}"; then
            echo 'Legacy or clunky branded name remains.'
            exit 1
          fi
          if grep -nE 'Διαγνωστικός =|ξανακάνεις τον Διαγνωστικό|Κάνε το διαγνωστικό' site-postfix.js pwa-core.js; then
            echo 'Legacy shorthand remains in shared UI.'
            exit 1
          fi
          echo 'Final Practice Map naming check passed.'

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pwa-core.js site-postfix.js index.html quiz-data.js site-integrity-overrides.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No cleanup changes needed.'
            exit 0
          fi
          git commit -m 'Finish Practice Map naming cleanup'
          git push origin HEAD:fix/practice-map-source-of-truth
