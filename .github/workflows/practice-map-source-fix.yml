name: Apply Practice Map source fix

on:
  push:
    branches:
      - fix/practice-map-source-of-truth

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/practice-map-source-of-truth
          fetch-depth: 0

      - name: Replace legacy diagnostic branding at source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          branded_files = [
              'app.js',
              'index.html',
              'methodology.html',
              'ai-ergaleia-gia-mathites.html',
              'site-postfix.js',
              'pwa-core.js',
              'quiz-data.js',
              'site-integrity-overrides.js',
              'gel-2026-2027-update.js',
              'curriculum-2026-2027-expansion.js',
              'report-error.html',
          ]

          changed = []
          for filename in branded_files:
              p = Path(filename)
              if not p.exists():
                  raise SystemExit(f'missing expected file: {filename}')
              old = p.read_text(encoding='utf-8')
              new = old
              new = new.replace('Διαγνωστικός Χάρτης', 'Χάρτης Εξάσκησης')
              new = new.replace('Diagnostic Map', 'Practice Map')
              new = new.replace('Diagnostic Learning Compass', 'Practice Map')
              new = new.replace('Learning Compass', 'Practice Map')

              if filename == 'app.js':
                  new = new.replace('heroQuizCta: "Κάνε το Διαγνωστικό σε 2 λεπτά"', 'heroQuizCta: "Χάρτης Εξάσκησης σε 2 λεπτά"')
                  new = new.replace('heroQuizCta: "Take the 2-minute Diagnostic"', 'heroQuizCta: "Practice Map in 2 minutes"')
                  new = new.replace(
                      'heroQuizCtaSub: "Οποιαδήποτε στιγμή, χωρίς διάβασμα πριν. Δείχνει τι ξέρεις ήδη, και μπορείς να το ξανακάνεις σε λίγες εβδομάδες για να δεις την πρόοδο."',
                      'heroQuizCtaSub: "Λίγες σύντομες ερωτήσεις για να δεις ποια σημεία αξίζει να εξασκήσεις περισσότερο. Χωρίς βαθμό και χωρίς διάγνωση — μόνο ένα σημείο εκκίνησης για το επόμενο Μονοπάτι Μάθησης."'
                  )
                  new = new.replace(
                      'heroQuizCtaSub: "Anytime, no studying required. It shows what you already know, and you can retake it in a few weeks to see your progress."',
                      'heroQuizCtaSub: "A few short questions to spot what may be worth practising more. No grade and no diagnosis — just a starting point for the next Learning Path."'
                  )
                  new = new.replace(
                      'Ο οδηγός, τα εργαλεία και το διαγνωστικό δεν χρησιμοποιούν cookies ούτε απαιτούν λογαριασμό. Το αποτέλεσμα του διαγνωστικού μπορεί να αποθηκευτεί μόνο τοπικά στη συσκευή σου.',
                      'Ο οδηγός, τα εργαλεία και ο Χάρτης Εξάσκησης δεν χρησιμοποιούν cookies ούτε απαιτούν λογαριασμό. Η πρόοδος του Χάρτη μπορεί να αποθηκευτεί μόνο τοπικά στη συσκευή σου.'
                  )
                  new = new.replace(
                      'The guide, tool directory and diagnostic use no cookies and require no account. Diagnostic progress may be stored only on your device.',
                      'The guide, tool directory and Practice Map use no cookies and require no account. Practice Map progress may be stored only on your device.'
                  )
                  new = new.replace('Δεν υπάρχει ακόμα διαγνωστικό κουίζ για αυτή τη ζώνη.', 'Δεν υπάρχει ακόμα Χάρτης Εξάσκησης για αυτή τη ζώνη.')
                  new = new.replace('Δεν υπάρχει ακόμα διαγνωστικό κουίζ για αυτή την τάξη.', 'Δεν υπάρχει ακόμα Χάρτης Εξάσκησης για αυτή την τάξη.')
                  new = new.replace('No diagnostic quiz yet for this zone.', 'No Practice Map yet for this zone.')
                  new = new.replace('No diagnostic quiz yet for this grade.', 'No Practice Map yet for this grade.')
                  new = new.replace("${isGreek ? 'Practice Map' : 'Practice Map'}", "${isGreek ? 'Χάρτης Εξάσκησης' : 'Practice Map'}")

              if filename == 'index.html':
                  new = new.replace('διαγνωστικό τεστ, learning paths', 'Χάρτη Εξάσκησης, learning paths')
                  new = new.replace('με διαγνωστικό και προαιρετική AI Βοήθεια', 'με Χάρτη Εξάσκησης και προαιρετική AI Βοήθεια')
                  new = new.replace('Περιλαμβάνει διαγνωστικό τεστ, learning paths', 'Περιλαμβάνει Χάρτη Εξάσκησης, learning paths')
                  new = new.replace('Διαγνωστικό τεστ 2 λεπτών', 'Χάρτης Εξάσκησης 2 λεπτών')
                  new = new.replace('Κάνε το Διαγνωστικό σε 2 λεπτά', 'Χάρτης Εξάσκησης σε 2 λεπτά')
                  new = new.replace(
                      'Οποιαδήποτε στιγμή, χωρίς διάβασμα πριν. Δείχνει τι ξέρεις ήδη, και μπορείς να το ξανακάνεις σε λίγες εβδομάδες για να δεις την πρόοδο.',
                      'Λίγες σύντομες ερωτήσεις για να δεις ποια σημεία αξίζει να εξασκήσεις περισσότερο. Χωρίς βαθμό και χωρίς διάγνωση — μόνο ένα σημείο εκκίνησης για το επόμενο Μονοπάτι Μάθησης.'
                  )
                  new = new.replace('οδηγός και το διαγνωστικό', 'οδηγός και ο Χάρτης Εξάσκησης')

              if filename == 'ai-ergaleia-gia-mathites.html':
                  new = new.replace('με διαγνωστικό, εργαλεία και καθοδήγηση', 'με Χάρτη Εξάσκησης, εργαλεία και καθοδήγηση')
                  new = new.replace('χρησιμοποίησε το διαγνωστικό 2 λεπτών', 'χρησιμοποίησε τον Χάρτη Εξάσκησης 2 λεπτών')
                  new = new.replace('κάνε το σύντομο διαγνωστικό ώστε', 'χρησιμοποίησε τον σύντομο Χάρτη Εξάσκησης ώστε')
                  new = new.replace('Δες το διαγνωστικό', 'Δες τον Χάρτη Εξάσκησης')

              if new != old:
                  p.write_text(new, encoding='utf-8')
                  changed.append(filename)

          # The runtime rename from PR #38 is now redundant; keep only the useful curriculum/home refinements.
          p = Path('home-accessibility.js')
          old = p.read_text(encoding='utf-8')
          new = old.replace(
              '/** Homepage/shared refinements: accessible resources, Practice Map copy, curriculum discovery. */',
              '/** Homepage/shared refinements: accessible resources and curriculum discovery. */'
          )
          new = re.sub(
              r'\n  function setText\(selector, text\)\{.*?\n  function ensureCurriculumMapEntry\(en\)\{',
              '\n  function ensureCurriculumMapEntry(en){',
              new,
              flags=re.S,
          )
          new = new.replace('    refinePracticeMapCopy(en);\n', '')
          if new == old:
              raise SystemExit('home-accessibility.js runtime Practice Map patch was not removed')
          p.write_text(new, encoding='utf-8')
          changed.append('home-accessibility.js')

          print('changed files:')
          for filename in changed:
              print(' -', filename)
          PY

      - name: Verify source-of-truth naming
        shell: bash
        run: |
          set -euo pipefail
          files=(app.js index.html methodology.html ai-ergaleia-gia-mathites.html site-postfix.js pwa-core.js quiz-data.js site-integrity-overrides.js gel-2026-2027-update.js curriculum-2026-2027-expansion.js report-error.html)
          if grep -nE 'Διαγνωστικός Χάρτης|Diagnostic Map|Learning Compass' "${files[@]}"; then
            echo 'Legacy branded name remains.'
            exit 1
          fi
          if grep -n 'refinePracticeMapCopy' home-accessibility.js; then
            echo 'Runtime rename function still exists.'
            exit 1
          fi
          grep -nE 'Χάρτης Εξάσκησης|Practice Map' app.js index.html methodology.html ai-ergaleia-gia-mathites.html | head -80
          echo 'Practice Map source-of-truth check passed.'

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html methodology.html ai-ergaleia-gia-mathites.html site-postfix.js pwa-core.js quiz-data.js site-integrity-overrides.js gel-2026-2027-update.js curriculum-2026-2027-expansion.js report-error.html home-accessibility.js
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Move Practice Map rename into source of truth'
          git push origin HEAD:fix/practice-map-source-of-truth
