name: Apply Practice Map source fix

on:
  push:
    branches:
      - fix/practice-map-source-of-truth

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/practice-map-source-of-truth
          fetch-depth: 0

      - name: Replace legacy diagnostic branding at source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
            'app.js': [
              ('Διαγνωστικός Χάρτης (Learning Compass)', 'Χάρτης Εξάσκησης (Practice Map)'),
              ('heroQuizCta: "Κάνε το Διαγνωστικό σε 2 λεπτά"', 'heroQuizCta: "Χάρτης Εξάσκησης σε 2 λεπτά"'),
              ('heroQuizCtaSub: "Οποιαδήποτε στιγμή, χωρίς διάβασμα πριν. Δείχνει τι ξέρεις ήδη, και μπορείς να το ξανακάνεις σε λίγες εβδομάδες για να δεις την πρόοδο."', 'heroQuizCtaSub: "Λίγες σύντομες ερωτήσεις για να δεις ποια σημεία αξίζει να εξασκήσεις περισσότερο. Χωρίς βαθμό και χωρίς διάγνωση — μόνο ένα σημείο εκκίνησης για το επόμενο Μονοπάτι Μάθησης."'),
              ('viewTabQuiz: "Διαγνωστικός Χάρτης"', 'viewTabQuiz: "Χάρτης Εξάσκησης"'),
              ('viewTabQuiz: "Learning Compass"', 'viewTabQuiz: "Practice Map"'),
              ('heroQuizCta: "Take the 2-minute Diagnostic"', 'heroQuizCta: "Practice Map in 2 minutes"'),
              ('heroQuizCtaSub: "Anytime, no studying required. It shows what you already know, and you can retake it in a few weeks to see your progress."', 'heroQuizCtaSub: "A few short questions to spot what may be worth practising more. No grade and no diagnosis — just a starting point for the next Learning Path."'),
              ('Ο οδηγός, τα εργαλεία και το διαγνωστικό δεν χρησιμοποιούν cookies ούτε απαιτούν λογαριασμό. Το αποτέλεσμα του διαγνωστικού μπορεί να αποθηκευτεί μόνο τοπικά στη συσκευή σου.', 'Ο οδηγός, τα εργαλεία και ο Χάρτης Εξάσκησης δεν χρησιμοποιούν cookies ούτε απαιτούν λογαριασμό. Η πρόοδος του Χάρτη μπορεί να αποθηκευτεί μόνο τοπικά στη συσκευή σου.'),
              ('The guide, tool directory and diagnostic use no cookies and require no account. Diagnostic progress may be stored only on your device.', 'The guide, tool directory and Practice Map use no cookies and require no account. Practice Map progress may be stored only on your device.'),
              ('quizEmptyState: "Δεν υπάρχει ακόμα διαγνωστικό κουίζ για αυτή τη ζώνη. Έρχεται σύντομα."', 'quizEmptyState: "Δεν υπάρχει ακόμα Χάρτης Εξάσκησης για αυτή τη ζώνη. Έρχεται σύντομα."'),
              ('quizGradeEmptyState: "Δεν υπάρχει ακόμα διαγνωστικό κουίζ για αυτή την τάξη. Έρχεται σύντομα."', 'quizGradeEmptyState: "Δεν υπάρχει ακόμα Χάρτης Εξάσκησης για αυτή την τάξη. Έρχεται σύντομα."'),
              ('quizEmptyState: "No diagnostic quiz yet for this zone. Coming soon."', 'quizEmptyState: "No Practice Map yet for this zone. Coming soon."'),
              ('quizGradeEmptyState: "No diagnostic quiz yet for this grade. Coming soon."', 'quizGradeEmptyState: "No Practice Map yet for this grade. Coming soon."'),
              ("${isGreek ? 'Learning Compass' : 'Learning Compass'}", "${isGreek ? 'Χάρτης Εξάσκησης' : 'Practice Map'}"),
            ],
            'index.html': [
              ('διαγνωστικό τεστ, learning paths', 'Χάρτη Εξάσκησης, learning paths'),
              ('με διαγνωστικό και προαιρετική AI Βοήθεια', 'με Χάρτη Εξάσκησης και προαιρετική AI Βοήθεια'),
              ('Περιλαμβάνει διαγνωστικό τεστ, learning paths', 'Περιλαμβάνει Χάρτη Εξάσκησης, learning paths'),
              ('Διαγνωστικό τεστ 2 λεπτών', 'Χάρτη Εξάσκησης 2 λεπτών'),
              ('Κάνε το Διαγνωστικό σε 2 λεπτά', 'Χάρτης Εξάσκησης σε 2 λεπτά'),
              ('Οποιαδήποτε στιγμή, χωρίς διάβασμα πριν. Δείχνει τι ξέρεις ήδη, και μπορείς να το ξανακάνεις σε λίγες εβδομάδες για να δεις την πρόοδο.', 'Λίγες σύντομες ερωτήσεις για να δεις ποια σημεία αξίζει να εξασκήσεις περισσότερο. Χωρίς βαθμό και χωρίς διάγνωση — μόνο ένα σημείο εκκίνησης για το επόμενο Μονοπάτι Μάθησης.'),
              ('Διαγνωστικός Χάρτης', 'Χάρτης Εξάσκησης'),
              ('οδηγός και το διαγνωστικό', 'οδηγός και ο Χάρτης Εξάσκησης'),
            ],
            'methodology.html': [
              ('4. Διαγνωστικός Χάρτης και Μονοπάτια Μάθησης', '4. Χάρτης Εξάσκησης και Μονοπάτια Μάθησης'),
              ('4. Diagnostic Map and Learning Paths', '4. Practice Map and Learning Paths'),
              ('Ο Διαγνωστικός Χάρτης είναι σύντομη αυτοαξιολόγηση εξάσκησης', 'Ο Χάρτης Εξάσκησης είναι σύντομη αυτοαξιολόγηση εξάσκησης'),
              ('The Diagnostic Map is a short practice self-assessment', 'The Practice Map is a short practice self-assessment'),
            ],
            'ai-ergaleia-gia-mathites.html': [
              ('με διαγνωστικό, εργαλεία και καθοδήγηση', 'με Χάρτη Εξάσκησης, εργαλεία και καθοδήγηση'),
              ('χρησιμοποίησε το διαγνωστικό 2 λεπτών', 'χρησιμοποίησε τον Χάρτη Εξάσκησης 2 λεπτών'),
              ('Στο site υπάρχει και Διαγνωστικός Χάρτης.', 'Στο site υπάρχει και Χάρτης Εξάσκησης.'),
              ('κάνε το σύντομο διαγνωστικό ώστε', 'χρησιμοποίησε τον σύντομο Χάρτη Εξάσκησης ώστε'),
              ('Δες το διαγνωστικό', 'Δες τον Χάρτη Εξάσκησης'),
            ],
            'site-postfix.js': [
              ('Diagnostic Map', 'Practice Map'),
              ('Διαγνωστικός Χάρτης', 'Χάρτης Εξάσκησης'),
              ('Κάνε πρώτα τον Χάρτη Εξάσκησης των 2 λεπτών.', 'Ξεκίνα με τον Χάρτη Εξάσκησης των 2 λεπτών.'),
            ],
            'pwa-core.js': [
              ('Diagnostic Map', 'Practice Map'),
              ('Learning Compass', 'Practice Map'),
              ('Διαγνωστικός Χάρτης', 'Χάρτης Εξάσκησης'),
            ],
            'quiz-data.js': [
              ('Ο Διαγνωστικός Χάρτης Μάθησης', 'Ο Χάρτης Εξάσκησης'),
              ('Diagnostic Learning Compass', 'Practice Map'),
              ('Learning Compass', 'Practice Map'),
            ],
            'site-integrity-overrides.js': [
              ('Ο Διαγνωστικός Χάρτης Μάθησης', 'Ο Χάρτης Εξάσκησης'),
              ('Diagnostic Learning Compass', 'Practice Map'),
              ('Learning Compass', 'Practice Map'),
            ],
            'gel-2026-2027-update.js': [
              ('Ο Διαγνωστικός Χάρτης Μάθησης', 'Ο Χάρτης Εξάσκησης'),
              ('Diagnostic Learning Compass', 'Practice Map'),
              ('Learning Compass', 'Practice Map'),
            ],
            'curriculum-2026-2027-expansion.js': [
              ('Ο Διαγνωστικός Χάρτης Μάθησης', 'Ο Χάρτης Εξάσκησης'),
              ('Diagnostic Learning Compass', 'Practice Map'),
              ('Learning Compass:', 'Practice Map:'),
            ],
            'report-error.html': [
              ('Διαγνωστικός Χάρτης', 'Χάρτης Εξάσκησης'),
              ('Diagnostic Map', 'Practice Map'),
              ('Learning Compass', 'Practice Map'),
            ],
          }

          changed = []
          for filename, pairs in replacements.items():
            p = Path(filename)
            if not p.exists():
              raise SystemExit(f'missing expected file: {filename}')
            old = p.read_text(encoding='utf-8')
            new = old
            for a, b in pairs:
              new = new.replace(a, b)
            if new != old:
              p.write_text(new, encoding='utf-8')
              changed.append(filename)

          # Remove the temporary runtime rename layer now that source strings are authoritative.
          p = Path('home-accessibility.js')
          old = p.read_text(encoding='utf-8')
          new = old
          new = new.replace('/** Homepage/shared refinements: accessible resources, Practice Map copy, curriculum discovery. */', '/** Homepage/shared refinements: accessible resources and curriculum discovery. */')
          new = re.sub(r'\n  function setText\(selector, text\)\{.*?\n  function ensureCurriculumMapEntry\(en\)\{', '\n  function ensureCurriculumMapEntry(en){', new, flags=re.S)
          new = new.replace('    refinePracticeMapCopy(en);\n', '')
          if new == old:
            raise SystemExit('home-accessibility.js runtime Practice Map patch was not removed')
          p.write_text(new, encoding='utf-8')
          changed.append('home-accessibility.js')

          print('changed files:')
          for f in changed:
            print(' -', f)
          PY

      - name: Verify source-of-truth naming
        shell: bash
        run: |
          set -euo pipefail
          echo 'Legacy branded names remaining in user-facing source:'
          if grep -nE 'Διαγνωστικός Χάρτης|Diagnostic Map|Learning Compass' app.js index.html methodology.html ai-ergaleia-gia-mathites.html site-postfix.js pwa-core.js quiz-data.js site-integrity-overrides.js gel-2026-2027-update.js curriculum-2026-2027-expansion.js report-error.html; then
            exit 1
          fi
          if grep -n 'refinePracticeMapCopy' home-accessibility.js; then
            echo 'runtime rename function still exists'
            exit 1
          fi
          echo 'Practice Map source-of-truth check passed.'

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html methodology.html ai-ergaleia-gia-mathites.html site-postfix.js pwa-core.js quiz-data.js site-integrity-overrides.js gel-2026-2027-update.js curriculum-2026-2027-expansion.js report-error.html home-accessibility.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Move Practice Map rename into source of truth'
          git push origin HEAD:fix/practice-map-source-of-truth
