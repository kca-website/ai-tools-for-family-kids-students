name: Refine quick-answer blocks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-quick-answer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refine informational landing pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove accidental insertions from functional pages that do not use the SEO-guide template.
          for filename in ('preschool.html', 'special-education.html'):
              p = Path(filename)
              if not p.exists():
                  continue
              html = p.read_text(encoding='utf-8')
              html2 = re.sub(r'<aside class="quick-answer" aria-label="Σύντομη απάντηση"><strong>Σύντομη απάντηση</strong><p>.*?</p></aside>', '', html, count=1, flags=re.S)
              if html2 != html:
                  p.write_text(html2, encoding='utf-8')

          summaries = {
            'ai-gia-epal.html': 'Για μαθητές ΕΠΑΛ, το aitools4kids.gr οργανώνει την AI βοήθεια ανά τάξη, τομέα ή ειδικότητα και σχολική ανάγκη, ώστε η μελέτη να ξεκινά από την πραγματική ύλη και όχι από μια γενική απάντηση chatbot.',
            'ai-gia-mathimatika.html': 'Το aitools4kids.gr βοηθά μαθητές να χρησιμοποιούν AI στα Μαθηματικά για κατανόηση, υπόδειξη, έλεγχο και εξάσκηση, με προσωπική προσπάθεια πριν από την AI και χωρίς έτοιμη λύση ως πρώτο βήμα.',
            'ai-gia-ekthesi.html': 'Το aitools4kids.gr βοηθά στη Γλώσσα και την Έκθεση με ιδέες, ερωτήσεις, δομή και ανατροφοδότηση πάνω στη δική σου προσπάθεια, χωρίς να μετατρέπει το AI σε μηχανή έτοιμων σχολικών κειμένων.',
            'ai-gia-fysiki-chimeia.html': 'Το aitools4kids.gr συνδέει τη Φυσική και τη Χημεία με AI εξηγήσεις, εξάσκηση και έλεγχο πάνω στη σχολική ύλη, ώστε ο μαθητής να καταλαβαίνει τη διαδικασία και όχι απλώς να βλέπει το τελικό αποτέλεσμα.',
            'ai-gia-xenes-glosses.html': 'Το aitools4kids.gr προτείνει εργαλεία AI για ξένες γλώσσες ανά ηλικία και ανάγκη, όπως κατανόηση, λεξιλόγιο, γραφή, προφορά και εξάσκηση, με έλεγχο των όρων χρήσης κάθε υπηρεσίας.',
            'asfales-ai-gia-paidia.html': 'Το aitools4kids.gr βοηθά γονείς και εκπαιδευτικούς να επιλέγουν AI εργαλεία με βάση την ηλικία, τους όρους χρήσης, την ιδιωτικότητα και τη μαθησιακή ανάγκη του παιδιού, αντί να θεωρούν κάθε AI υπηρεσία κατάλληλη για ανηλίκους.'
          }

          def insert_after_hero(html, block):
              m = re.search(r'(</section>\s*)(<article\b)', html, flags=re.I|re.S)
              if m:
                  return html[:m.start()] + m.group(1) + block + m.group(2) + html[m.end():]
              m = re.search(r'(<article\b[^>]*>)', html, flags=re.I|re.S)
              if m:
                  return html[:m.end()] + block + html[m.end():]
              return None

          patched=[]
          skipped=[]
          for filename, text in summaries.items():
              p=Path(filename)
              if not p.exists():
                  skipped.append(filename+' (missing)')
                  continue
              html=p.read_text(encoding='utf-8')
              # Only SEO-guide pages get this shared visual pattern.
              if '/seo-guide.css' not in html:
                  skipped.append(filename+' (different template)')
                  continue
              if 'class="quick-answer"' in html:
                  skipped.append(filename+' (already present)')
                  continue
              block=f'<aside class="quick-answer" aria-label="Σύντομη απάντηση"><strong>Σύντομη απάντηση</strong><p>{text}</p></aside>'
              updated=insert_after_hero(html, block)
              if not updated:
                  skipped.append(filename+' (no insertion point)')
                  continue
              p.write_text(updated, encoding='utf-8')
              patched.append(filename)

          wf=Path('.github/workflows/refine-quick-answer.yml')
          if wf.exists(): wf.unlink()
          print('PATCHED:', ', '.join(patched) or 'none')
          print('SKIPPED:', ', '.join(skipped) or 'none')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refine quick-answer coverage on SEO pages"
          git push origin main
