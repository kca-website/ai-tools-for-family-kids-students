name: Schoolbook runtime coverage (bounded batch)
on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/grounding-runtime.mjs'
      - '.github/workflows/release-grounding-live.yml'
  workflow_dispatch:
    inputs:
      offset:
        description: First row (zero-based) from runtime inventory
        default: '0'
        required: true
      limit:
        description: Number of source requests (1–50, no AI calls)
        default: '20'
        required: true
permissions:
  contents: read
concurrency:
  group: schoolbook-runtime-coverage
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify retrieval of real official source text
        env:
          OFFSET: ${{ inputs.offset }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node qa/grounding-runtime.mjs --sample-per-level=2
          else
            node qa/grounding-runtime.mjs --offset="$OFFSET" --limit="$LIMIT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schoolbook-runtime-${{ github.run_id }}
          path: qa/results/release-gate/
          if-no-files-found: error
