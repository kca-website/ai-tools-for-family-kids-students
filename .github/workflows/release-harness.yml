name: Release harness
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-harness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix qa --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Static, curriculum, provider and server regression checks
        run: node qa/release-gate.mjs offline
      - name: Inventory runtime source coverage (no network)
        if: always()
        run: node qa/grounding-runtime.mjs --inventory=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-offline-results
          path: qa/results/release-gate/
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix qa --no-audit --no-fund
      - name: Install Chromium
        working-directory: qa
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile functional regressions
        run: node qa/release-gate.mjs browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-browser-results
          path: |
            qa/results/release-gate/
            qa/results/playwright-report.json
            qa/test-results/
          if-no-files-found: error
  release-gate:
    if: always()
    needs: [offline, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require both mandatory checks
        env:
          OFFLINE: ${{ needs.offline.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$OFFLINE" = success && test "$BROWSER" = success
