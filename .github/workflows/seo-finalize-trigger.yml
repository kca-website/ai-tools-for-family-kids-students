name: Trigger final SEO audit once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/seo-finalize-trigger.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-final-audit-2026-09-17
          fetch-depth: 0
      - name: Run SEO finalizer from branch workflow
        run: |
          python - <<'PY'
          import re, subprocess, datetime
          from pathlib import Path
          from urllib.parse import urlparse
          from html.parser import HTMLParser
          ROOT=Path('.'); OG='https://www.aitools4kids.gr/assets/og-image.png'; changed=[]
          def meta(s,key,prop=False):
            a='property' if prop else 'name'
            m=re.search(r'<meta\s+[^>]*'+a+r'=["\']'+re.escape(key)+r'["\'][^>]*content=["\']([^"\']*)["\'][^>]*>',s,re.I) or re.search(r'<meta\s+[^>]*content=["\']([^"\']*)["\'][^>]*'+a+r'=["\']'+re.escape(key)+r'["\'][^>]*>',s,re.I)
            return m.group(1).strip() if m else ''
          htmls=[p for p in ROOT.rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]
          for p in htmls:
            s=p.read_text(encoding='utf-8'); o=s
            tm=re.search(r'<title>(.*?)</title>',s,re.I|re.S); title=re.sub(r'\s+',' ',tm.group(1)).strip() if tm else ''; desc=meta(s,'description')
            cm=re.search(r'<link\s+[^>]*rel=["\']canonical["\'][^>]*href=["\']([^"\']+)["\'][^>]*>',s,re.I); can=cm.group(1).strip() if cm else ''
            if title and desc and can and 'aitools4kids.gr' in can:
              ins=[]
              if not meta(s,'og:image',True): ins.append(f'<meta property="og:image" content="{OG}">')
              if not meta(s,'og:image:width',True): ins.append('<meta property="og:image:width" content="1200">')
              if not meta(s,'og:image:height',True): ins.append('<meta property="og:image:height" content="630">')
              if not meta(s,'og:image:alt',True): ins.append('<meta property="og:image:alt" content="AI Tools for Family, Kids & Students">')
              if not meta(s,'twitter:card'): ins.append('<meta name="twitter:card" content="summary_large_image">')
              if not meta(s,'twitter:image'): ins.append(f'<meta name="twitter:image" content="{OG}">')
              if ins: s=s[:cm.end()]+'\n'+'\n'.join(ins)+s[cm.end():]
            if p.as_posix()=='index.html':
              s=re.sub(r'(<noscript>.*?<div[^>]*>)\s*<h1>(.*?)</h1>',r'\1\n      <p><strong>\2</strong></p>',s,count=1,flags=re.I|re.S)
              s=s.replace('<h1 id="pathZoneHeading"></h1>','<h2 id="pathZoneHeading"></h2>')
            if s!=o: p.write_text(s,encoding='utf-8'); changed.append(p.as_posix())
          sm=ROOT/'sitemap.xml'
          if sm.exists():
            x=sm.read_text(encoding='utf-8'); today=datetime.date.today().isoformat()
            def f(m):
              b=m.group(0); lm=re.search(r'<loc>(.*?)</loc>',b)
              if not lm:return b
              path=urlparse(lm.group(1)).path.lstrip('/') or 'index.html'; path=path+'index.html' if path.endswith('/') else path; fp=ROOT/path
              if not fp.exists(): return b
              if path in changed:d=today
              else:
                try:d=subprocess.check_output(['git','log','-1','--format=%cs','--',path],text=True).strip() or today
                except:d=today
              return re.sub(r'<lastmod>.*?</lastmod>',f'<lastmod>{d}</lastmod>',b) if '<lastmod>' in b else b.replace('</url>',f'  <lastmod>{d}</lastmod>\n</url>')
            nx=re.sub(r'<url>.*?</url>',f,x,flags=re.S)
            if nx!=x:sm.write_text(nx,encoding='utf-8');changed.append('sitemap.xml')
          noindex=[]; h1bad=[]; missing=[]; alt=[]; broken=set()
          class P(HTMLParser):
            def __init__(self):super().__init__();self.href=[];self.img=[]
            def handle_starttag(self,t,a):
              d=dict(a)
              if t=='a' and d.get('href'):self.href.append(d['href'])
              if t=='img':self.img.append(d)
          for p in htmls:
            s=p.read_text(encoding='utf-8'); n=len(re.findall(r'<h1\b',s,re.I))
            if n!=1:h1bad.append(f'{p}: {n} H1')
            if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+noindex',s,re.I):noindex.append(str(p))
            if not(re.search(r'<title>.+?</title>',s,re.I|re.S) and meta(s,'description') and re.search(r'<link[^>]+rel=["\']canonical["\']',s,re.I)):missing.append(str(p))
            q=P();q.feed(s)
            if any('alt' not in im for im in q.img):alt.append(str(p))
            for h in q.href:
              if h.startswith(('#','mailto:','tel:','javascript:','http://','https://')):continue
              pp=urlparse(h).path
              if not pp:continue
              target=ROOT/pp.lstrip('/') if pp.startswith('/') else p.parent/pp
              if Path(pp).suffix and not target.exists():broken.add(f'{p} -> {h}')
          r=['# SEO final audit','',f'Date: {datetime.date.today().isoformat()}',f'HTML files checked: {len(htmls)}',f'Files updated: {len(changed)}','','## Updated files']+[f'- {z}' for z in changed]+['','## H1 issues']+([f'- {z}' for z in h1bad] or ['- None'])+['','## noindex pages']+([f'- {z}' for z in noindex] or ['- None'])+['','## Missing title/description/canonical']+([f'- {z}' for z in missing] or ['- None'])+['','## Images missing alt']+([f'- {z}' for z in sorted(set(alt))] or ['- None'])+['','## Broken file-like internal links']+([f'- {z}' for z in sorted(broken)] or ['- None'])+['','## Core Web Vitals','- Requires live measurement; static audit does not invent LCP/INP/CLS values.']
          (ROOT/'SEO-FINAL-AUDIT.md').write_text('\n'.join(r)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Finalize technical SEO across site" && git push origin HEAD:seo-final-audit-2026-09-17; fi
