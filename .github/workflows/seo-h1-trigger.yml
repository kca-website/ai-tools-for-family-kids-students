name: Trigger SEO heading cleanup once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/seo-h1-trigger.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-final-audit-2026-09-17
          fetch-depth: 0
      - name: Fix heading semantics and redirect indexing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, datetime
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          root=Path('.')
          htmls=[p for p in root.rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]
          changed=[]
          for p in htmls:
            s=p.read_text(encoding='utf-8'); o=s
            # One semantic H1 for bilingual pages: keep both language variants inside one H1.
            s=re.sub(r'<h1([^>]*)\sdata-lang=["\']el["\']([^>]*)>(.*?)</h1>\s*<h1([^>]*)\sdata-lang=["\']en["\']([^>]*)>(.*?)</h1>',
                     r'<h1\1\2><span data-lang="el">\3</span><span data-lang="en">\6</span></h1>',s,flags=re.I|re.S)
            if p.as_posix()=='index.html':
              s=s.replace('<h1 class="section-heading" id="pathZoneHeading"></h1>','<h2 class="section-heading" id="pathZoneHeading"></h2>')
            if p.as_posix()=='special-education-preview.html' and not re.search(r'name=["\']robots["\']',s,re.I):
              s=s.replace('<meta name="viewport" content="width=device-width, initial-scale=1.0" />','<meta name="viewport" content="width=device-width, initial-scale=1.0" />\n  <meta name="robots" content="noindex,follow" />')
            if s!=o:
              p.write_text(s,encoding='utf-8'); changed.append(p.as_posix())

          def getmeta(s,name):
            m=re.search(r'<meta[^>]+name=["\']'+re.escape(name)+r'["\'][^>]+content=["\']([^"\']*)',s,re.I) or re.search(r'<meta[^>]+content=["\']([^"\']*)["\'][^>]+name=["\']'+re.escape(name)+r'["\']',s,re.I)
            return m.group(1) if m else ''
          h1bad=[]; noindex=[]; missing=[]; alt=[]; broken=set()
          class P(HTMLParser):
            def __init__(self):super().__init__();self.href=[];self.img=[]
            def handle_starttag(self,t,a):
              d=dict(a)
              if t=='a' and d.get('href'):self.href.append(d['href'])
              if t=='img':self.img.append(d)
          for p in htmls:
            s=p.read_text(encoding='utf-8'); ni='noindex' in getmeta(s,'robots').lower()
            if ni:noindex.append(str(p))
            if not ni:
              n=len(re.findall(r'<h1\b',s,re.I))
              if n!=1:h1bad.append(f'{p}: {n} H1')
              if not(re.search(r'<title>.+?</title>',s,re.I|re.S) and getmeta(s,'description') and re.search(r'<link[^>]+rel=["\']canonical["\']',s,re.I)):missing.append(str(p))
            q=P();q.feed(s)
            if any('alt' not in im for im in q.img):alt.append(str(p))
            for h in q.href:
              if h.startswith(('#','mailto:','tel:','javascript:','http://','https://')):continue
              pp=urlparse(h).path
              if not pp:continue
              target=root/pp.lstrip('/') if pp.startswith('/') else p.parent/pp
              if Path(pp).suffix and not target.exists():broken.add(f'{p} -> {h}')
          r=['# SEO final audit','',f'Date: {datetime.date.today().isoformat()}',f'HTML files checked: {len(htmls)}','','## Heading/metadata cleanup files']+[f'- {x}' for x in changed]+['','## H1 issues on indexable pages']+([f'- {x}' for x in h1bad] or ['- None'])+['','## Intentional noindex pages']+([f'- {x}' for x in noindex] or ['- None'])+['','## Missing title/description/canonical on indexable pages']+([f'- {x}' for x in missing] or ['- None'])+['','## Images missing alt']+([f'- {x}' for x in sorted(set(alt))] or ['- None'])+['','## Broken file-like internal links']+([f'- {x}' for x in sorted(broken)] or ['- None'])+['','## Core Web Vitals','- Live measurement required; no synthetic values are invented by this static audit.']
          (root/'SEO-FINAL-AUDIT.md').write_text('\n'.join(r)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix SEO heading semantics and redirect indexing" || exit 0
          git push origin HEAD:seo-final-audit-2026-09-17
