name: Special Education data smoke

on:
  pull_request:
    paths:
      - 'special-education*.js'
      - 'special-education*.html'
      - 'special-education*.css'
      - 'pwa.js'
      - 'teacher-assistant.html'
      - 'tests/special-education-*.mjs'
      - 'tests/teacher-curriculum-coverage-audit.mjs'
      - '.github/workflows/special-education-data-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'special-education*.js'
      - 'special-education*.html'
      - 'special-education*.css'
      - 'pwa.js'
      - 'teacher-assistant.html'
      - 'tests/special-education-*.mjs'
      - 'tests/teacher-curriculum-coverage-audit.mjs'
      - '.github/workflows/special-education-data-smoke.yml'

jobs:
  data-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Special Education datasets
        run: node tests/special-education-data-smoke.mjs
      - name: Validate Special Gymnasium B/C support quizzes
        run: node tests/special-gymnasium-bc-data-smoke.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/aitools4kids-special-http.log 2>&1 &
          echo $! > /tmp/aitools4kids-special-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/special-education.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aitools4kids-special-http.log
          exit 1
      - name: Run strict teacher curriculum mapping smoke
        run: node tests/special-education-teacher-curriculum-smoke.mjs
      - name: Audit teacher curriculum coverage across every school context
        run: node tests/teacher-curriculum-coverage-audit.mjs
      - name: Run Special Education page desktop/mobile smoke
        run: node tests/special-education-page-smoke.mjs
      - name: Run Special Education homepage diagnostic smoke
        run: node tests/special-education-diagnostic-smoke.mjs
      - name: Run Special Education AI Tutor desktop/mobile smoke
        run: node tests/special-education-tutor-smoke.mjs
      - name: Run Special Education AI Tutor action-menu smoke
        run: node tests/special-education-tutor-actions-smoke.mjs
      - name: Run Special Education AI deep-link smoke
        run: node tests/special-education-deeplink-smoke.mjs
      - name: Show local server log on failure
        if: failure()
        run: cat /tmp/aitools4kids-special-http.log || true
