name: Temporary AI Study Studio extras patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-ai-study-studio-extras.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch AI Study Studio extras
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pdf-text-reader.js')
          s=p.read_text(encoding='utf-8')
          marker='// AI Study Studio extras: source-grounded visual study formats.'
          if marker in s:
              raise SystemExit('Studio extras already present')

          s=s.replace(
              '    let observer=null;\n    let updating=false;\n',
              '    let observer=null;\n    let updating=false;\n    let studioOverride=null;\n    let pendingStudioDisclosure=false;\n    let studioOutputObserver=null;\n',
              1
          )

          studio=r'''
    // AI Study Studio extras: source-grounded visual study formats.
    // Existing flashcards, quizzes and audio are intentionally NOT duplicated.
    const studioActions={
      mindmap:{
        titleEl:"Mind Map ενότητας",titleEn:"Unit Mind Map",serverActivity:"summary",mode:"review",
        labelEl:"Mind Map",labelEn:"Mind Map",subEl:"έννοιες και σχέσεις σε δενδροειδή μορφή",subEn:"concepts and relationships in a tree",
        ruleEl:"Φτιάξε ένα σύντομο Mind Map της ενεργής πηγής. Βάλε στο κέντρο το βασικό θέμα και 3–6 κύριους κλάδους με σύντομους υποκλάδους. Χρησιμοποίησε μόνο έννοιες και σχέσεις που υποστηρίζονται ρητά από την πηγή. Μορφή markdown με καθαρή ιεραρχία, όχι πίνακα.",
        ruleEn:"Create a compact Mind Map of the active source. Put the main topic at the centre and use 3–6 main branches with short sub-branches. Use only concepts and relationships explicitly supported by the source. Return clear hierarchical markdown, not a table."
      },
      infographic:{
        titleEl:"Πληροφοριακό γράφημα",titleEn:"Infographic",serverActivity:"creative",mode:"organize",
        labelEl:"Infographic",labelEn:"Infographic",subEl:"έτοιμη δομή για οπτική σύνοψη",subEn:"a visual-summary-ready structure",
        ruleEl:"Δημιούργησε περιεχόμενο για εκπαιδευτικό infographic από την ενεργή πηγή: 1 σύντομος τίτλος, 4–6 μικρές ενότητες, πολύ σύντομα bullets, βασικοί όροι και μόνο αριθμοί ή ημερομηνίες που υπάρχουν ρητά στην πηγή. Για κάθε ενότητα πρότεινε ένα απλό εικονίδιο ή οπτικό μοτίβο χωρίς να επινοείς νέο γεγονός. Μην το μετατρέψεις σε έτοιμη σχολική εργασία.",
        ruleEn:"Create educational infographic-ready content from the active source: one short title, 4–6 compact sections, very short bullets, key terms, and only numbers or dates explicitly present in the source. Suggest one simple icon or visual motif per section without inventing facts. Do not turn it into a ready-to-submit assignment."
      },
      slides:{
        titleEl:"Διαφάνειες μελέτης",titleEn:"Study slides",serverActivity:"presentation",mode:"organize",
        labelEl:"Διαφάνειες",labelEn:"Slides",subEl:"σκελετός 6 διαφανειών από την ενότητα",subEn:"a 6-slide scaffold from the unit",
        ruleEl:"Φτιάξε σκελετό 6 διαφανειών για μελέτη της ενεργής πηγής. Για κάθε διαφάνεια δώσε τίτλο, 2–4 σύντομα bullets και μία πρόταση για οπτικό στοιχείο που προκύπτει από την πηγή. Η τελευταία διαφάνεια να είναι αυτοέλεγχος με 2 σύντομες ερωτήσεις. Μην γράψεις έτοιμη εργασία προς παράδοση και μην προσθέσεις πληροφορίες εκτός πηγής.",
        ruleEn:"Create a 6-slide study scaffold from the active source. For each slide give a title, 2–4 short bullets and one source-supported visual suggestion. Make the last slide a self-check with two short questions. Do not create a ready-to-submit assignment or add information outside the source."
      },
      datatable:{
        titleEl:"Πίνακας δεδομένων",titleEn:"Data table",serverActivity:"summary",mode:"organize",
        labelEl:"Πίνακας δεδομένων",labelEn:"Data table",subEl:"σύγκριση στοιχείων μόνο όταν ταιριάζει",subEn:"compare facts only when the source supports it",
        ruleEl:"Εξέτασε αν η ενεργή πηγή περιέχει στοιχεία που έχουν νόημα να συγκριθούν σε πίνακα. Αν ναι, φτιάξε έναν μικρό markdown πίνακα 3–6 γραμμών, με στήλες που προκύπτουν φυσικά από την πηγή. Αν όχι, πες καθαρά ότι η συγκεκριμένη ενότητα δεν προσφέρεται για πίνακα δεδομένων και δώσε 3 βασικά σημεία αντί γι' αυτό. Μην επινοήσεις καμία τιμή, κατηγορία ή ημερομηνία.",
        ruleEn:"Check whether the active source contains facts that are meaningfully comparable in a table. If yes, create a small markdown table with 3–6 rows and columns that arise naturally from the source. If not, clearly say this unit is not suited to a data table and give three key points instead. Do not invent any value, category or date."
      }
    };

    function studioDisclosure(en){
      return en
        ? "Free alternative: NotebookLM also offers these kinds of study outputs in Studio. The Standard version can be used free of charge with usage limits. aitools4kids.gr is independent and is not affiliated with Google or NotebookLM."
        : "Δωρεάν εναλλακτική: το NotebookLM προσφέρει επίσης τέτοιες μορφές μελέτης μέσα από το Studio. Η Standard έκδοση χρησιμοποιείται δωρεάν με όρια χρήσης. Το aitools4kids.gr είναι ανεξάρτητο και δεν συνδέεται με τη Google ή το NotebookLM.";
    }

    function ensureStudioStyles(){
      if(document.getElementById('studyStudioExtraStyles'))return;
      const style=document.createElement('style');
      style.id='studyStudioExtraStyles';
      style.textContent='.study-studio-block{grid-column:1/-1;margin-top:4px;padding-top:12px;border-top:1px solid var(--border,#dfe6ee)}.study-studio-title{margin:0 0 4px;font-size:.92rem;font-weight:850}.study-studio-note{margin:0 0 10px;padding:9px 10px;border-radius:9px;background:#f6f8fb;color:#475569;font-size:.78rem;line-height:1.45}.study-studio-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.study-studio-output-note{margin-top:12px;padding:9px 10px;border-top:1px solid var(--border,#dfe6ee);color:var(--muted,#5a6270);font-size:.78rem}@media(max-width:480px){.study-studio-grid{grid-template-columns:1fr}}';
      document.head.appendChild(style);
    }

    function installStudioActions(){
      if(document.getElementById('studyStudioBlock'))return;
      const moreGrid=document.querySelector('details.learning-more .study-actions.learning-choice-grid');
      if(!moreGrid)return;
      ensureStudioStyles();
      const block=document.createElement('div');
      block.id='studyStudioBlock';
      block.className='study-studio-block';
      const en=isEn();
      block.innerHTML='<p class="study-studio-title">'+(en?'More ways to study the same source':'Περισσότεροι τρόποι για την ίδια πηγή')+'</p><p class="study-studio-note">'+studioDisclosure(en)+'</p><div class="study-studio-grid"></div>';
      const grid=block.querySelector('.study-studio-grid');
      Object.entries(studioActions).forEach(([key,cfg])=>{
        if(document.querySelector('[data-action="'+key+'"],[data-studio-action="'+key+'"]'))return;
        const button=document.createElement('button');
        button.type='button';button.className='study-action';button.dataset.studioAction=key;
        button.innerHTML='<span>'+(en?cfg.labelEn:cfg.labelEl)+'</span><span>'+(en?cfg.subEn:cfg.subEl)+'</span>';
        grid.appendChild(button);
      });
      moreGrid.appendChild(block);
    }

    function refreshStudioLanguage(){
      const block=document.getElementById('studyStudioBlock');if(!block)return;
      const en=isEn();
      const title=block.querySelector('.study-studio-title'),note=block.querySelector('.study-studio-note');
      if(title)title.textContent=en?'More ways to study the same source':'Περισσότεροι τρόποι για την ίδια πηγή';
      if(note)note.textContent=studioDisclosure(en);
      block.querySelectorAll('[data-studio-action]').forEach(button=>{
        const cfg=studioActions[button.dataset.studioAction];if(!cfg)return;
        const spans=button.querySelectorAll('span');
        if(spans[0])spans[0].textContent=en?cfg.labelEn:cfg.labelEl;
        if(spans[1])spans[1].textContent=en?cfg.subEn:cfg.subEl;
      });
    }

    function appendStudioOutputDisclosure(){
      if(!pendingStudioDisclosure)return;
      const output=document.getElementById('aiOutput');
      if(!output||output.querySelector('.ai-loading')||!output.textContent.trim())return;
      if(!output.querySelector('.study-studio-output-note')){
        const note=document.createElement('div');note.className='study-studio-output-note';note.textContent=studioDisclosure(isEn());output.appendChild(note);
      }
      pendingStudioDisclosure=false;
    }

    function watchStudioOutput(){
      const output=document.getElementById('aiOutput');if(!output||studioOutputObserver)return;
      studioOutputObserver=new MutationObserver(()=>appendStudioOutputDisclosure());
      studioOutputObserver.observe(output,{childList:true,subtree:true,characterData:true});
    }

    function runStudioAction(key,button){
      const cfg=studioActions[key],base=document.querySelector('[data-action="quickreview"]');
      if(!cfg||!base)return;
      studioOverride={key,cfg};pendingStudioDisclosure=true;button.disabled=true;base.click();
      const title=document.getElementById('workspaceTitle');
      if(title)title.textContent=isEn()?cfg.titleEn:cfg.titleEl;
      setTimeout(()=>{if(title)title.textContent=isEn()?cfg.titleEn:cfg.titleEl;button.disabled=false;},0);
    }

    function attachStudioActions(){
      document.addEventListener('click',(event)=>{
        const button=event.target?.closest?.('[data-studio-action]');if(!button)return;
        event.preventDefault();event.stopImmediatePropagation();runStudioAction(button.dataset.studioAction,button);
      },true);
    }

'''
          needle='    // Flashcards are strict JSON and the server validates all numbers/formulae\n'
          if needle not in s:
              raise SystemExit('Cannot find flashcard guard anchor')
          s=s.replace(needle,studio+needle,1)

          old='''              payload.context=String(payload.context||"").trim()+"\\n\\n"+rule;\n              init={...init,body:JSON.stringify(payload)};\n            }\n          }catch(_){/* keep the original request unchanged */}\n'''
          new='''              payload.context=String(payload.context||"").trim()+"\\n\\n"+rule;\n              init={...init,body:JSON.stringify(payload)};\n            }else if(studioOverride && payload?.activity==="quickreview"){\n              const cfg=studioOverride.cfg;\n              payload.activity=cfg.serverActivity;\n              payload.task="guided_task";\n              payload.mode=cfg.mode;\n              payload.context=String(payload.context||"").trim()+"\\n\\nSTUDIO SOURCE-GROUNDED OUTPUT:\\n"+(isEn()?cfg.ruleEn:cfg.ruleEl);\n              payload.prompt=String(payload.prompt||"").trim()+"\\n\\n"+(isEn()?cfg.ruleEn:cfg.ruleEl);\n              if(payload.studyContext&&typeof payload.studyContext==="object")payload.studyContext.studyAction=studioOverride.key;\n              init={...init,body:JSON.stringify(payload)};\n              studioOverride=null;\n            }\n          }catch(_){/* keep the original request unchanged */}\n'''
          if old not in s:
              raise SystemExit('Cannot find fetch guard insertion anchor')
          s=s.replace(old,new,1)

          old_start='''    function start(){\n      installStudyRequestConsistencyGuard();\n      enhanceNotebookCard();\n      attachGridObserver();\n      attachAudioGuard();\n'''
          new_start='''    function start(){\n      installStudyRequestConsistencyGuard();\n      installStudioActions();\n      watchStudioOutput();\n      enhanceNotebookCard();\n      attachGridObserver();\n      attachAudioGuard();\n      attachStudioActions();\n'''
          if old_start not in s:
              raise SystemExit('Cannot find start anchor')
          s=s.replace(old_start,new_start,1)

          old_lang='''      new MutationObserver(()=>enhanceNotebookCard()).observe(document.documentElement,{\n        attributes:true,\n        attributeFilter:["lang"]\n      });\n'''
          new_lang='''      new MutationObserver(()=>{enhanceNotebookCard();refreshStudioLanguage()}).observe(document.documentElement,{\n        attributes:true,\n        attributeFilter:["lang"]\n      });\n'''
          if old_lang not in s:
              raise SystemExit('Cannot find language observer anchor')
          s=s.replace(old_lang,new_lang,1)

          # Keep NotebookLM visible as the free external alternative in the existing recommendation card.
          s=s.replace(
              '"Για ακόμη καλύτερη μελέτη, ανέβασε το PDF του σχολικού βιβλίου. Το NotebookLM μπορεί να εντοπίσει τα βασικά σημεία, να δημιουργήσει σύνοψη και Audio Overview βασισμένα στις πηγές σου."',
              '"Δωρεάν εναλλακτική για μελέτη πάνω σε πηγές: το NotebookLM μπορεί επίσης να δημιουργεί Audio Overviews, κάρτες, quiz, Mind Maps, infographics και παρουσιάσεις μέσα από το Studio, με όρια χρήσης στη Standard έκδοση."',
              1
          )
          s=s.replace(
              '"For deeper study, upload the schoolbook PDF. NotebookLM can find the key points, create source-grounded summaries and generate an Audio Overview."',
              '"Free source-grounded alternative: NotebookLM can also create Audio Overviews, flashcards, quizzes, Mind Maps, infographics and slide decks in Studio, with usage limits on the Standard tier."',
              1
          )

          p.write_text(s,encoding='utf-8')
          PY
          node --check pdf-text-reader.js
          rm -f .github/workflows/temp-ai-study-studio-extras.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf-text-reader.js .github/workflows/temp-ai-study-studio-extras.yml
          git commit -m "Add source-grounded AI Study Studio formats"
          git push origin HEAD:main
