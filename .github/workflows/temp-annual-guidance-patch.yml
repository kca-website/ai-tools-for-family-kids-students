name: TEMP annual guidance patch

on:
  push:
    branches:
      - feature/annual-instructions-2026-2027

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/annual-instructions-2026-2027

      - name: Apply deterministic page patch
        run: python3 scripts/apply-annual-guidance-patch.py

      - name: Commit patched pages
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xartis-ylis.html classroom.html
          git commit -m "Wire annual guidance into curriculum views"
          git push
