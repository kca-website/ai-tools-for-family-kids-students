name: TEMP fix homepage loop a11y

on:
  push:
    branches:
      - position/practice-map-home-spine

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: position/practice-map-home-spine
      - run: python3 scripts/fix-home-loop-a11y.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Give the homepage learning loop an accessible group role"
          git push
