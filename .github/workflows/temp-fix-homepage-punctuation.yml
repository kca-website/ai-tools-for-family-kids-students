name: TEMP fix homepage punctuation

on:
  push:
    branches:
      - fix/homepage-punctuation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-punctuation
      - run: python3 scripts/fix-homepage-punctuation.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Remove AI-style em dashes from homepage copy"
          git push
