name: Temporary Tools hub link fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-tools-hub-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix Tools hub internal links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'href="/learning-paths.html"':'href="/#practice-map"',
            'href="/prompt-generator.html"':'href="/#open-tools"',
            'href="/teacher.html"':'href="/teacher-dashboard.html"',
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Tools hub internal destinations'
          git push origin main
