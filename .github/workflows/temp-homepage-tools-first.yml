name: TEMP homepage tools first

on:
  push:
    branches:
      - fix/homepage-tools-first

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-tools-first
      - run: python3 scripts/rebalance-homepage-identity.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html home-accessibility.js styles.css
          git commit -m "Put AI tools back at the front of the homepage"
          git push
