name: TEMP restore homepage hero copy

on:
  push:
    branches:
      - fix/restore-homepage-hero-copy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-homepage-hero-copy
      - run: python3 scripts/restore-homepage-hero-copy.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Restore original homepage hero subtitle"
          git push
