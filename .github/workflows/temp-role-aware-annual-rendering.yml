name: TEMP role-aware annual rendering

on:
  push:
    branches:
      - feature/annual-instructions-2026-2027

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/annual-instructions-2026-2027

      - name: Apply deterministic patch
        run: python3 scripts/apply-role-aware-annual-rendering.py

      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official-annual-instructions-2026-2027.js xartis-ylis.html classroom.html tests/annual-guidance-smoke.mjs
          git commit -m "Make annual guidance rendering role-aware"
          git push
