name: Trust metadata and homepage positioning smoke

on:
  push:
    branches:
      - main
      - fix/trust-date-positioning-20260909
  pull_request:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 2 -type f -name '*.js' -print0)

      - name: Run date architecture smoke
        run: node tests/date-architecture-smoke.mjs

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/aitools4kids-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aitools4kids-http.log
          exit 1

      - name: Run homepage positioning smoke
        run: node tests/home-positioning-smoke.mjs

      - name: Show local server log on failure
        if: failure()
        run: cat /tmp/aitools4kids-http.log || true
