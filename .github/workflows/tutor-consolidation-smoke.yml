name: Tutor consolidation smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches:
      - 'feature/**'
      - refactor/tutor-consolidation
  pull_request:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 2 -type f -name '*.js' -print0)

      - name: Run repository data integrity smoke
        run: node tests/repository-data-integrity-smoke.mjs

      - name: Run Higher Education data smoke
        run: node tests/higher-education-data-smoke.mjs

      - name: Run Higher Education AI endpoint smoke
        run: node tests/higher-education-ai-endpoint-smoke.mjs

      - name: Run AI provider router smoke
        run: node tests/ai-provider-router-smoke.mjs

      - name: Run Phase 8 grounding regression tests
        run: node --test qa/tests/phase8-grounding.test.mjs

      - name: Run Phase 9 production correctness tests
        run: node --test qa/tests/phase9-production-correctness.test.mjs

      - name: Install Playwright and axe-core
        run: |
          npm install --no-save playwright@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Start local static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/aitools4kids-http.log 2>&1 &
          echo $! > /tmp/aitools4kids-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aitools4kids-http.log
          exit 1

      - name: Run Higher Education hidden pilot smoke
        run: node tests/higher-education-pilot-smoke.mjs

      - name: Run WCAG 2.2 report-only audit
        run: node tests/wcag-22-audit.mjs

      - name: Run Tool Nutrition Labels smoke
        run: node tests/tool-nutrition-labels-smoke.mjs

      - name: Run methodology and ENG finding smoke
        run: node tests/methodology-eng-finding-smoke.mjs

      - name: Run installed-mobile homepage smoke
        run: node tests/mobile-home-pwa-smoke.mjs

      - name: Run homepage positioning smoke
        run: node tests/home-positioning-smoke.mjs

      - name: Run learning-need tool priority smoke
        run: node tests/need-tool-priority-smoke.mjs

      - name: Run early Primary simple quiz smoke
        run: node tests/primary-simple-quiz-smoke.mjs

      - name: Run AI Help trust-boundary smoke
        run: node tests/ai-help-trust-boundary-smoke.mjs

      - name: Run Classroom View smoke
        run: node tests/classroom-view-smoke.mjs

      - name: Run annual guidance smoke
        run: node tests/annual-guidance-smoke.mjs

      - name: Run remaining B Gym schoolbook grounding smoke
        run: node tests/b-gym-remaining-schoolbook-grounding.mjs

      - name: Run remaining B Gym diagnostic provenance smoke
        run: node tests/b-gym-remaining-diagnostic-scope.mjs

      - name: Run A and G Gym History schoolbook grounding smoke
        run: node tests/a-g-gym-history-schoolbook-grounding.mjs

      - name: Run A and G Gym Math schoolbook grounding smoke
        run: node tests/a-g-gym-math-schoolbook-grounding.mjs

      - name: Run A and G Gym Greek language schoolbook grounding smoke
        run: node tests/a-g-gym-language-schoolbook-grounding.mjs

      - name: Run G Gym science schoolbook grounding smoke
        run: node tests/g-gym-science-schoolbook-grounding.mjs

      - name: Run shared StudyContext smoke
        run: node tests/study-context-smoke.mjs

      - name: Run StudyContext navigation and restore smoke
        run: node tests/study-context-navigation-smoke.mjs

      - name: Run AI Study UX smoke
        run: node tests/ai-study-ux-smoke.mjs

      - name: Run AI Study cache/source safety smoke
        run: node tests/study-cache-safety-smoke.mjs

      - name: Run Phase 11 study-tools grounding contract
        run: node tests/phase11-study-tools-grounding-smoke.mjs

      - name: Run Phase 11 objective coverage audit
        run: node tests/phase11-coverage-audit.mjs

      - name: Run Phase 11B additional Gymnasium schoolbook grounding
        run: node tests/phase11b-gymnasium-grounding-smoke.mjs

      - name: Run Phase 11A Primary schoolbook grounding
        run: node tests/phase11-primary-schoolbook-grounding-smoke.mjs

      - name: Run Phase 11A official navigation discovery
        run: node tests/phase11-primary-source-discovery.mjs

      - name: Run Phase 11A live official-source grounding
        run: node tests/phase11-primary-source-live-smoke.mjs

      - name: Run Phase 11C GEL Informatics schoolbook grounding
        run: node tests/phase11-gel-informatics-grounding-smoke.mjs

      - name: Run Phase 11D EPAL grounding audit
        run: node tests/phase11d-epal-grounding-audit.mjs

      - name: Run Phase 12 catalog schoolbook grounding
        run: node tests/phase12-catalog-schoolbook-grounding-smoke.mjs

      - name: Run Phase 13 Primary math schoolbook grounding
        run: node tests/phase13-primary-math-grounding-smoke.mjs

      - name: Run Phase 13 remaining Primary core grounding
        run: node tests/phase13-primary-core-grounding-smoke.mjs

      - name: Run Phase 13 Gymnasium and GEL HTML grounding
        run: node tests/phase13-secondary-html-grounding-smoke.mjs

      - name: Run Phase 14 Primary and Gymnasium strict grounding
        run: node tests/phase14-primary-middle-grounding-smoke.mjs

      - name: Run Phase 14 GEL schoolbook-source inventory audit
        run: node tests/phase14-gel-schoolbook-source-audit.mjs

      - name: Run Phase 15 GEL runtime grounding integration
        run: node tests/phase15-gel-schoolbook-runtime-integration-smoke.mjs

      - name: Run Phase 16 GEL verified PDF page grounding
        run: node tests/phase16-gel-pdf-grounding-smoke.mjs

      - name: Run Phase 17 GEL manual override audit
        run: node tests/phase17-gel-manual-overrides-smoke.mjs

      - name: Run Phase 18 GEL grounding coverage audit
        run: node tests/phase18-gel-grounding-coverage-smoke.mjs

      - name: Run Phase 19 GEL manual official discovery audit
        run: node tests/phase19-gel-manual-discovery-smoke.mjs

      - name: Run Phase 20 GEL final safe candidate audit
        run: node tests/phase20-gel-final-safe-candidates-smoke.mjs

      - name: Run AI benchmark harness smoke (mock, no network)
        run: node tests/ai-benchmark-harness-smoke.mjs

      - name: Run Ancient Greek subject dedupe smoke
        run: node tests/curriculum-resolver-subject-dedupe-smoke.mjs

      - name: Run curriculum provenance smoke
        run: node tests/curriculum-provenance-smoke.mjs

      - name: Run desktop/mobile production parity checks
        run: node tests/tutor-consolidation-smoke.mjs

      - name: Show local server log on failure
        if: failure()
        run: cat /tmp/aitools4kids-http.log || true
