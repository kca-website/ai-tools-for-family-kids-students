name: Widen homepage desktop layout

on:
  push:
    paths:
      - '.github/workflows/widen-homepage-desktop.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Widen homepage desktop only
        shell: python
        run: |
          from pathlib import Path

          path = Path('navigator-home.css')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace('#zoneSelectView .hero{\n  max-width:760px;', '#zoneSelectView .hero{\n  max-width:1040px;', 1)
          text = text.replace('.home-v8-eng{\n  display:flex;', '.home-v8-eng{\n  display:flex;', 1)
          text = text.replace('  max-width:760px;\n  margin:22px auto 0;', '  max-width:1040px;\n  margin:22px auto 0;', 1)
          text = text.replace('#zoneSelectView>.not-guide-box{\n  max-width:760px;', '#zoneSelectView>.not-guide-box{\n  max-width:1040px;', 1)
          text = text.replace('.home-v8-curriculum{\n  max-width:760px;', '.home-v8-curriculum{\n  max-width:1040px;', 1)

          if text == original:
              raise SystemExit('No expected homepage width changes found; aborting.')
          if '#zoneSelectView .hero{\n  max-width:1040px;' not in text:
              raise SystemExit('Hero width was not updated.')

          path.write_text(text, encoding='utf-8')

      - name: Commit wider desktop layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigator-home.css
          git commit -m "Widen homepage desktop layout"
          git push origin main
